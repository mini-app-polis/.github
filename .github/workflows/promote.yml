# The fleet's shared dev → main promotion.
#
# Every repository here works on `dev` and releases from `main`, so what is
# on `dev` and not yet on `main` is exactly what the next release will
# contain. This workflow keeps one pull request open that says so: on each
# push to `dev` it opens a `dev` → `main` pull request if none is open, and
# otherwise rewrites the open one's description to list what is waiting.
# Merging stays a person's decision; nothing here merges.
#
# "Waiting" means commits on `dev` that `main` does not have, merges
# excluded. A `dev` that only differs from `main` by merge commits — a
# back-merge of `main`, say — has nothing to release, so no pull request is
# opened for it.
#
# **It opens the pull request as a GitHub App, not as GITHUB_TOKEN.** A pull
# request opened by `github-actions[bot]` does get its `pull_request`
# workflows queued, but GitHub holds every one of them at "action required"
# until a person approves the run — on every promotion, in every repository.
# A pull request opened by an installed App runs CI like any other. The App
# needs only Pull requests: write and Contents: read, is installed on the
# org, and its credentials are two org secrets:
#
#   PROMOTE_APP_CLIENT_ID    — the App's client ID
#   PROMOTE_APP_PRIVATE_KEY  — a private key generated for the App
#
# Without them the job fails and says so, rather than falling back to
# GITHUB_TOKEN and quietly bringing the approvals back.
#
# Usage, as its own workflow in the consumer:
#
#   name: promote
#   on:
#     push:
#       branches: [dev]
#   permissions:
#     contents: read
#   jobs:
#     promote:
#       uses: mini-app-polis/.github/.github/workflows/promote.yml@v3
#       secrets: inherit

name: promote

on:
  workflow_call:
    inputs:
      from:
        description: "Branch that collects work (the pull request's head)."
        type: string
        default: dev
      to:
        description: "Branch that releases (the pull request's base)."
        type: string
        default: main
    # Optional in the declaration so a missing secret reaches the explicit
    # check below, with a message that says what to set, instead of a bare
    # workflow-validation error.
    secrets:
      PROMOTE_APP_CLIENT_ID:
        description: "Client ID of the GitHub App that opens the pull request."
        required: false
      PROMOTE_APP_PRIVATE_KEY:
        description: "Private key of that GitHub App."
        required: false

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Two quick pushes to dev must not race to open two pull requests.
    concurrency:
      group: promote-${{ github.repository }}-${{ inputs.from }}-${{ inputs.to }}
      cancel-in-progress: false
    steps:
      - name: Require the promote App's credentials
        env:
          CLIENT_ID: ${{ secrets.PROMOTE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.PROMOTE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::PROMOTE_APP_CLIENT_ID and PROMOTE_APP_PRIVATE_KEY must be set (org secrets) and passed with 'secrets: inherit'."
            exit 1
          fi

      # Scoped to this repository (the action's default when no owner is
      # given) and to the two permissions the job uses.
      - name: Mint an App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PROMOTE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROMOTE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          # Both branches' history, to count what dev has that main lacks.
          fetch-depth: 0

      - name: Open or refresh the promotion pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          set -euo pipefail

          range="origin/${TO}..origin/${FROM}"
          waiting=$(git rev-list --count --no-merges "$range")
          if [ "$waiting" -eq 0 ]; then
            echo "Nothing on ${FROM} that ${TO} lacks; no pull request needed."
            exit 0
          fi

          body=$(mktemp)
          {
            echo "Promotes \`${FROM}\` to \`${TO}\`. Merging releases these ${waiting} commit(s):"
            echo
            # -n rather than `| head`: under pipefail, head closing the pipe
            # early would kill git with SIGPIPE and fail the job.
            git log --no-merges -n 100 --format='- %s (%h)' "$range"
            if [ "$waiting" -gt 100 ]; then echo "- …and $((waiting - 100)) more"; fi
            echo
            echo "_Opened and kept current by the fleet's promote workflow on every push to \`${FROM}\`._"
          } > "$body"

          number=$(gh pr list --base "$TO" --head "$FROM" --state open \
            --json number --jq '.[0].number // empty')

          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$body"
            echo "Refreshed #${number} (${waiting} commit(s) waiting)."
          else
            gh pr create --base "$TO" --head "$FROM" \
              --title "chore: promote ${FROM} to ${TO}" --body-file "$body"
          fi
