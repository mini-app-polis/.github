# The build stage against one fixture, for self-test.yml: build it, build it
# again in the same run, and take the artifact by digest as a later stage
# would. It is a workflow of its own because a matrix of reusable-workflow
# calls keeps only one leg's outputs, and each check here needs its own
# fixture's.
#
#   first    stages-build.yml on the fixture.
#   again    stages-build.yml on the same commit. It must take the artifact
#            already in the run, not rebuild it, and report the same digest
#            (README, "Running a stage twice").
#   consume  The fetch-artifact action with first's name and digest, as
#            release and deploy use it. A profile with nothing to build must
#            have said so and reported no artifact.
#
#   deploy   stages-deploy.yml with `target: fake`, to development with the
#            build's version and to production with the release version the
#            fixture declares, each twice. The first takes the artifact by
#            digest and deploys to the stand-in; the second must read that
#            the stand-in already runs the version and skip (README,
#            "Running a stage twice"). A profile with nothing to deploy
#            must say so and report no deployed version.
#
#   verify   stages-verify.yml with `target: fake` after each environment's
#            deploys: its stand-in service serves what the deploy stand-in
#            recorded, so development and production verify, and production
#            verifies again (it only reads, so it must pass twice). Then
#            once more with the stand-in serving another version: that run
#            must time out, fail its job, tell the stand-in Discord and
#            record the release as not verified. A profile with nothing to
#            verify must say so, and a library verifies only in production.
#
# Nothing leaves the run: the artifact and its SBOM are uploaded to the run,
# and the api-service image is saved to a tarball, never pushed. The deploy's
# stand-in is a record kept as an artifact of the run; it reads no target,
# holds no secret and pushes nothing. The verify stand-in is a service on
# the job's own loopback, and its record is an artifact of the run, not a
# commit status. The deploy and verify jobs are granted id-token, packages
# and statuses write only because GitHub checks a reusable workflow's
# permissions before any job's `if`: the stages ask for them for their live
# paths, which a fake target never takes.
name: self-test-build

on:
  workflow_call:
    inputs:
      profile:
        description: "The fixture's profile; the fixture is fixtures/<profile>."
        type: string
        required: true
      lambda-handler:
        description: "python-service: the fixture's handler, so the Lambda zip is built."
        type: string
        default: ""
      lambda-trigger:
        description: "python-service: what invokes the fixture's handler."
        type: string
        default: "sqs"

permissions:
  contents: read

jobs:
  first:
    uses: ./.github/workflows/stages-build.yml
    permissions:
      contents: read
    with:
      profile: ${{ inputs.profile }}
      working-directory: fixtures/${{ inputs.profile }}
      lambda-handler: ${{ inputs.lambda-handler }}
      lambda-trigger: ${{ inputs.lambda-trigger }}

  again:
    needs: first
    uses: ./.github/workflows/stages-build.yml
    permissions:
      contents: read
    with:
      profile: ${{ inputs.profile }}
      working-directory: fixtures/${{ inputs.profile }}
      lambda-handler: ${{ inputs.lambda-handler }}
      lambda-trigger: ${{ inputs.lambda-trigger }}

  consume:
    needs: [first, again]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PROFILE: ${{ inputs.profile }}
      NAME: ${{ needs.first.outputs.artifact-name }}
      DIGEST: ${{ needs.first.outputs.artifact-digest }}
      AGAIN_NAME: ${{ needs.again.outputs.artifact-name }}
      AGAIN_DIGEST: ${{ needs.again.outputs.artifact-digest }}
      AGAIN_REUSED: ${{ needs.again.outputs.reused }}
    steps:
      # For the local actions; nothing is built from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The second build took the first's artifact
        id: check
        run: |
          set -euo pipefail
          case "${PROFILE}" in
            terraform-infra|shared-workflows)
              if [ -n "${NAME}${DIGEST}${AGAIN_NAME}${AGAIN_DIGEST}" ]; then
                echo "::error::${PROFILE} has nothing to build, but the build reported an artifact."
                exit 1
              fi
              echo "${PROFILE}: no artifact, as the profile has none."
              echo "consume=false" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          if [ -z "${NAME}" ] || [ -z "${DIGEST}" ]; then
            echo "::error::${PROFILE} reported no artifact."
            exit 1
          fi
          if [ "${AGAIN_REUSED}" != true ]; then
            echo "::error::The second build on the same commit did not take the artifact already in the run."
            exit 1
          fi
          if [ "${AGAIN_NAME}" != "${NAME}" ] || [ "${AGAIN_DIGEST}" != "${DIGEST}" ]; then
            echo "::error::The second build reported ${AGAIN_NAME} ${AGAIN_DIGEST}; the first ${NAME} ${DIGEST}."
            exit 1
          fi
          echo "${NAME}: built once, ${DIGEST} both times."
          echo "consume=true" >> "$GITHUB_OUTPUT"

      - name: Take the artifact by digest
        id: artifact
        if: steps.check.outputs.consume == 'true'
        uses: ./.github/actions/fetch-artifact
        with:
          name: ${{ needs.first.outputs.artifact-name }}
          digest: ${{ needs.first.outputs.artifact-digest }}

      # What each profile's artifact must hold for the stage after it.
      - name: It holds what the profile builds
        if: steps.check.outputs.consume == 'true'
        env:
          DIR: ${{ steps.artifact.outputs.path }}
        run: |
          set -euo pipefail
          cat "${DIR}/SHA256SUMS"
          need() {
            if ! compgen -G "${DIR}/$1" > /dev/null; then
              echo "::error::${PROFILE}'s artifact has no $1."
              exit 1
            fi
          }
          case "${PROFILE}" in
            python-library) need 'dist/*.whl'; need 'dist/*.tar.gz' ;;
            python-service) need 'dist/*.whl'; need 'dist/*.tar.gz'; need lambda/worker.zip; need lambda/target.json ;;
            api-service) need image/image.tar; need image/image-id ;;
            astro-site) need site/site.tar.gz ;;
            npm-library) need 'package/*.tgz' ;;
            *) echo "::error::No expectation for ${PROFILE}."; exit 1 ;;
          esac

  # The version each environment deploys: development the build's, and
  # production the release the fixture declares, as release would report it.
  versions:
    needs: first
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      development: ${{ steps.v.outputs.development }}
      production: ${{ steps.v.outputs.production }}
    steps:
      - id: v
        env:
          BUILD_VERSION: ${{ needs.first.outputs.version }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          # A profile that builds nothing has no version; any will do, since
          # its deploy skips before reading one.
          development="${BUILD_VERSION:-0.0.0+g000000000000}"
          echo "development=${development}" >> "$GITHUB_OUTPUT"
          echo "production=${development%%+*}" >> "$GITHUB_OUTPUT"
          echo "${PROFILE}: development ${development}, production ${development%%+*}"

  deploy-development:
    needs: [first, versions]
    uses: ./.github/workflows/stages-deploy.yml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      profile: ${{ inputs.profile }}
      environment: development
      version: ${{ needs.versions.outputs.development }}
      artifact-name: ${{ needs.first.outputs.artifact-name }}
      artifact-digest: ${{ needs.first.outputs.artifact-digest }}
      target: fake
      lambda-handler: ${{ inputs.lambda-handler }}
      lambda-trigger: ${{ inputs.lambda-trigger }}

  deploy-development-again:
    needs: [first, versions, deploy-development]
    uses: ./.github/workflows/stages-deploy.yml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      profile: ${{ inputs.profile }}
      environment: development
      version: ${{ needs.versions.outputs.development }}
      artifact-name: ${{ needs.first.outputs.artifact-name }}
      artifact-digest: ${{ needs.first.outputs.artifact-digest }}
      target: fake
      lambda-handler: ${{ inputs.lambda-handler }}
      lambda-trigger: ${{ inputs.lambda-trigger }}

  deploy-production:
    needs: [first, versions]
    uses: ./.github/workflows/stages-deploy.yml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      profile: ${{ inputs.profile }}
      environment: production
      version: ${{ needs.versions.outputs.production }}
      artifact-name: ${{ needs.first.outputs.artifact-name }}
      artifact-digest: ${{ needs.first.outputs.artifact-digest }}
      target: fake
      lambda-handler: ${{ inputs.lambda-handler }}
      lambda-trigger: ${{ inputs.lambda-trigger }}

  deploy-production-again:
    needs: [first, versions, deploy-production]
    uses: ./.github/workflows/stages-deploy.yml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      profile: ${{ inputs.profile }}
      environment: production
      version: ${{ needs.versions.outputs.production }}
      artifact-name: ${{ needs.first.outputs.artifact-name }}
      artifact-digest: ${{ needs.first.outputs.artifact-digest }}
      target: fake
      lambda-handler: ${{ inputs.lambda-handler }}
      lambda-trigger: ${{ inputs.lambda-trigger }}

  # The first deploy to each environment deployed, the second skipped, and
  # both report the version the stand-in runs. A profile with nothing to
  # deploy reported nothing deployed.
  deploy:
    needs: [versions, deploy-development, deploy-development-again, deploy-production, deploy-production-again]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      PROFILE: ${{ inputs.profile }}
      DEV: ${{ needs.versions.outputs.development }}
      PROD: ${{ needs.versions.outputs.production }}
      DEV_FIRST: ${{ needs.deploy-development.outputs.deployed }}/${{ needs.deploy-development.outputs.deployed-version }}
      DEV_AGAIN: ${{ needs.deploy-development-again.outputs.deployed }}/${{ needs.deploy-development-again.outputs.deployed-version }}
      PROD_FIRST: ${{ needs.deploy-production.outputs.deployed }}/${{ needs.deploy-production.outputs.deployed-version }}
      PROD_AGAIN: ${{ needs.deploy-production-again.outputs.deployed }}/${{ needs.deploy-production-again.outputs.deployed-version }}
    steps:
      - name: Deployed once, skipped the second time
        run: |
          set -euo pipefail
          failures=0
          expect() {
            if [ "$2" = "$3" ]; then echo "ok: $1 ($2)"; else echo "::error::$1: $2, wanted $3 (deployed/deployed-version)"; failures=$((failures + 1)); fi
          }
          case "${PROFILE}" in
            python-service|api-service|astro-site)
              # On a re-run of this workflow the stand-in already holds the
              # first attempt's record, so the first deploy rightly skips too.
              first=true
              [ "${GITHUB_RUN_ATTEMPT}" -gt 1 ] && first="${DEV_FIRST%%/*}"
              expect "development, first" "${DEV_FIRST}" "${first}/${DEV}"
              expect "development, again" "${DEV_AGAIN}" "false/${DEV}"
              [ "${GITHUB_RUN_ATTEMPT}" -gt 1 ] && first="${PROD_FIRST%%/*}"
              expect "production, first" "${PROD_FIRST}" "${first}/${PROD}"
              expect "production, again" "${PROD_AGAIN}" "false/${PROD}" ;;
            *)
              for run in "${DEV_FIRST}" "${DEV_AGAIN}" "${PROD_FIRST}" "${PROD_AGAIN}"; do
                expect "nothing to deploy" "${run}" "false/"
              done ;;
          esac
          [ "${failures}" -eq 0 ]

  # ---- verify ---------------------------------------------------------------

  verify-development:
    needs: [versions, deploy-development-again]
    uses: ./.github/workflows/stages-verify.yml
    permissions:
      contents: read
      statuses: write
      packages: read
      id-token: write
    with:
      profile: ${{ inputs.profile }}
      environment: development
      version: ${{ needs.versions.outputs.development }}
      build-version: ${{ needs.versions.outputs.development }}
      target: fake
      lambda-handler: ${{ inputs.lambda-handler }}
      working-directory: fixtures/${{ inputs.profile }}

  verify-production:
    needs: [versions, deploy-production-again]
    uses: ./.github/workflows/stages-verify.yml
    permissions:
      contents: read
      statuses: write
      packages: read
      id-token: write
    with:
      profile: ${{ inputs.profile }}
      environment: production
      version: ${{ needs.versions.outputs.production }}
      build-version: ${{ needs.versions.outputs.development }}
      target: fake
      lambda-handler: ${{ inputs.lambda-handler }}
      working-directory: fixtures/${{ inputs.profile }}

  verify-production-again:
    needs: [versions, verify-production]
    uses: ./.github/workflows/stages-verify.yml
    permissions:
      contents: read
      statuses: write
      packages: read
      id-token: write
    with:
      profile: ${{ inputs.profile }}
      environment: production
      version: ${{ needs.versions.outputs.production }}
      build-version: ${{ needs.versions.outputs.development }}
      target: fake
      lambda-handler: ${{ inputs.lambda-handler }}
      working-directory: fixtures/${{ inputs.profile }}

  # The stand-in serves a version that is neither the release nor what the
  # build declares, so the poll can never match: short timings keep the
  # wait to seconds. Its job fails as a live one would; expect-failure keeps
  # that from failing this run, and `verify` below reads `outcome` to prove
  # it did fail. It runs after the match cases, so the production record it
  # leaves is the newest.
  verify-mismatch:
    needs: [versions, verify-production-again]
    uses: ./.github/workflows/stages-verify.yml
    permissions:
      contents: read
      statuses: write
      packages: read
      id-token: write
    with:
      profile: ${{ inputs.profile }}
      environment: production
      version: ${{ needs.versions.outputs.production }}
      build-version: ${{ needs.versions.outputs.development }}
      target: fake
      fake-serves: 0.0.0-not-this-release
      expect-failure: true
      verify-timeout-seconds: 6
      poll-initial-seconds: 1
      poll-max-seconds: 2
      lambda-handler: ${{ inputs.lambda-handler }}
      working-directory: fixtures/${{ inputs.profile }}

  # A match verifies, twice; a mismatch times out, fails its job, tells the
  # errors channel and leaves the release recorded as not verified.
  verify:
    needs: [versions, verify-development, verify-production, verify-production-again, verify-mismatch]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      PROFILE: ${{ inputs.profile }}
      PROD: ${{ needs.versions.outputs.production }}
      DEV_RESULT: ${{ needs.verify-development.outputs.verified }}/${{ needs.verify-development.outputs.outcome }}
      PROD_RESULT: ${{ needs.verify-production.outputs.verified }}/${{ needs.verify-production.outputs.outcome }}
      AGAIN_RESULT: ${{ needs.verify-production-again.outputs.verified }}/${{ needs.verify-production-again.outputs.outcome }}
      MISMATCH_RESULT: ${{ needs.verify-mismatch.outputs.verified }}/${{ needs.verify-mismatch.outputs.outcome }}
    steps:
      - name: Take the stand-in's records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verify-record-${{ inputs.profile }}-*
          path: ${{ runner.temp }}/verify-records

      - name: Verified on a match, failed and recorded on a mismatch
        env:
          RECORDS: ${{ runner.temp }}/verify-records
        run: |
          set -euo pipefail
          failures=0
          expect() {
            if [ "$2" = "$3" ]; then echo "ok: $1 ($2)"; else echo "::error::$1: $2, wanted $3 (verified/outcome)"; failures=$((failures + 1)); fi
          }
          # Found by its context, not its folder: download-artifact unpacks a
          # lone matching artifact straight into the path, with no folder
          # named after it (a library has only a production record).
          record() {
            local f
            while IFS= read -r f; do
              if jq -e --arg c "pipeline/verify ($1)" '.context == $c' "$f" > /dev/null 2>&1; then
                echo "$f"
                return
              fi
            done < <(find "${RECORDS}" -name record.json 2> /dev/null)
          }
          check() {
            if jq -e "$2" "$3" > /dev/null; then echo "ok: $1"; else echo "::error::$1: $(cat "$3")"; failures=$((failures + 1)); fi
          }
          dev_record="$(record development)"
          prod_record="$(record production)"
          case "${PROFILE}" in
            python-service|api-service|astro-site|python-library|npm-library)
              case "${PROFILE}" in
                python-library|npm-library)
                  expect "development: nothing published to verify" "${DEV_RESULT}" "skipped/success"
                  [ -z "${dev_record}" ] && echo "ok: no development record" || { echo "::error::a library left a development record"; failures=$((failures + 1)); } ;;
                *)
                  expect "development verifies" "${DEV_RESULT}" "true/success"
                  if [ -n "${dev_record}" ]; then
                    check "development is recorded verified" '.state == "success" and .context == "pipeline/verify (development)" and (.discord | length) == 0' "${dev_record}"
                  else
                    echo "::error::no development record"; failures=$((failures + 1))
                  fi ;;
              esac
              expect "production verifies" "${PROD_RESULT}" "true/success"
              expect "production verifies again" "${AGAIN_RESULT}" "true/success"
              expect "a mismatch times out and fails" "${MISMATCH_RESULT}" "false/failure"
              if [ -n "${prod_record}" ]; then
                check "the mismatch is recorded not verified" \
                  ".state == \"failure\" and .context == \"pipeline/verify (production)\" and .version == \"${PROD}\" and (.description | startswith(\"not verified ${PROD}\"))" "${prod_record}"
                check "the errors channel was told, once, naming the version" \
                  "(.discord | length) == 1 and (.discord[0].content | contains(\"${PROD}\") and contains(\"0.0.0-not-this-release\")) and .discord[0].allowed_mentions.parse == []" "${prod_record}"
              else
                echo "::error::no production record"; failures=$((failures + 1))
              fi ;;
            *)
              for run in "${DEV_RESULT}" "${PROD_RESULT}" "${AGAIN_RESULT}" "${MISMATCH_RESULT}"; do
                expect "nothing to verify" "${run}" "skipped/success"
              done
              [ -z "${dev_record}${prod_record}" ] && echo "ok: nothing recorded" || { echo "::error::${PROFILE} left a verify record"; failures=$((failures + 1)); } ;;
          esac
          [ "${failures}" -eq 0 ]
