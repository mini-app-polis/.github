# The fleet's shared Railway Infrastructure-as-Code apply, run on a push to
# the branch that deploys an environment (main for production) or by hand.
# It plans afresh and applies that plan — `railway config apply --yes` —
# as mini-app-polis/infra applies Terraform on a push to main. The merge is
# the approval: read the pull request's plan (railway-plan.yml) first.
#
# **Destructive changes need a label.** Removing a service or a variable is
# destructive, and the CLI refuses it in a non-interactive run unless
# --confirm-destructive is passed. That flag is passed only when the pull
# request the pushed commit came from is labelled allow-destroy — infra's
# rule, for the same reason: those are the changes that cause outages. A
# caller can set `allow-destroy: always` for an environment where that is
# the wrong trade (development, applied on every push to dev with no pull
# request to label).
#
# **blocked-window** keeps an apply out of a time when a redeploy would do
# harm. db-ops passes its drill window: applying a change to db-drill
# redeploys it, which stops a running drill before it can delete its forks.
# Format `<day-of-month> <first-hour>-<last-hour>`, UTC, hours inclusive —
# "02 09-10" is 09:00 to 10:59 on the 2nd. Empty, the default, blocks
# nothing.
#
# As with the plan, the token picks the environment: a project token scoped
# to it, kept as a repository secret. Never an account, workspace or
# org-wide token.
#
# Usage, from a repository's .github/workflows/railway-apply.yml:
#
#   on:
#     push:
#       branches: [main]
#       paths: [".railway/**", ".github/workflows/railway-apply.yml"]
#     workflow_dispatch:
#   permissions:
#     contents: read
#     pull-requests: read
#   jobs:
#     apply:
#       uses: mini-app-polis/.github/.github/workflows/railway-apply.yml@v3
#       secrets:
#         railway-token: ${{ secrets.RAILWAY_TOKEN }}

name: railway-apply

on:
  workflow_call:
    inputs:
      environment:
        description: "The Railway environment the token is scoped to. Names the run and its concurrency group; it does not select the environment."
        type: string
        default: "production"
      allow-destroy:
        description: "`label` (default): destructive changes apply only when the pull request the commit came from is labelled allow-destroy. `always`: they always apply."
        type: string
        default: "label"
      blocked-window:
        description: "`<day-of-month> <first-hour>-<last-hour>` in UTC during which the apply refuses to run, e.g. \"02 09-10\". Empty blocks nothing."
        type: string
        default: ""
      blocked-window-reason:
        description: "What the blocked window protects, printed when the apply refuses."
        type: string
        default: "a redeploy now would interrupt scheduled work"
    secrets:
      railway-token:
        description: "A Railway project token scoped to the environment being applied. Never an account or workspace token."
        required: true

jobs:
  apply:
    runs-on: ubuntu-latest
    # pull-requests: read finds the pull request a commit came from, for its
    # labels.
    permissions:
      contents: read
      pull-requests: read
    # One apply at a time per environment, never cancelled midway.
    concurrency:
      group: railway-apply-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.railway-token }}
    steps:
      - name: Outside the blocked window
        if: inputs.blocked-window != ''
        env:
          WINDOW: ${{ inputs.blocked-window }}
          REASON: ${{ inputs.blocked-window-reason }}
        run: |
          if ! [[ "$WINDOW" =~ ^([0-9]{2})\ ([0-9]{2})-([0-9]{2})$ ]]; then
            echo "::error::blocked-window '$WINDOW' is not '<DD> <HH>-<HH>'."
            exit 1
          fi
          day=${BASH_REMATCH[1]} first=$((10#${BASH_REMATCH[2]})) last=$((10#${BASH_REMATCH[3]}))
          hour=$((10#$(date -u +%H)))
          if [ "$(date -u +%d)" = "$day" ] && [ "$hour" -ge "$first" ] && [ "$hour" -le "$last" ]; then
            echo "::error::Inside the blocked window ($WINDOW UTC): $REASON. Re-run this job after $(printf '%02d' $((last + 1))):00 UTC."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install the Railway CLI and IaC SDK
        run: |
          npm install --global --no-audit --no-fund @railway/cli@5.68.0
          npm ci --prefix .railway --no-audit --no-fund

      # Planned again here rather than trusting the pull request's plan:
      # main's can differ from it. As in infra, nothing is applied when
      # there is nothing to apply, and destroys apply only under the label
      # on the pull request this merge came from.
      - name: plan
        id: plan
        run: |
          set +e
          railway config plan --verbose --detailed-exit-code > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          echo "changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: apply
        if: steps.plan.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_DESTROY: ${{ inputs.allow-destroy }}
        run: |
          flags=(--yes --verbose)
          grep -E '^  - ' plan.txt > destroys.txt || true
          if [ -s destroys.txt ]; then
            case "$ALLOW_DESTROY" in
              always)
                echo "::warning::Applying destroys; allow-destroy is 'always' for this environment:" ;;
              label)
                labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].labels[].name' 2>/dev/null | tr '\n' ' ')
                if [[ " $labels " != *" allow-destroy "* ]]; then
                  echo "::error::Refusing to apply unlabelled destroys. Label the pull request allow-destroy and re-run this job:"
                  cat destroys.txt
                  exit 1
                fi
                echo "::warning::Applying destroys allowed by allow-destroy:" ;;
              *)
                echo "::error::allow-destroy must be 'label' or 'always', not '$ALLOW_DESTROY'."
                exit 1 ;;
            esac
            cat destroys.txt
            flags+=(--confirm-destructive)
          fi
          railway config apply "${flags[@]}"
