# This repo runs the shared workflow against itself on every pull request,
# so a change to security.yml is exercised before any consumer picks it up.
#
# Job names are canonical per ecosystem-standards CD-026: security, test,
# release. The TypeScript self-call is named `test` because that is what it
# is — the work job of a repo whose only artifact is workflow YAML is the
# one that exercises that YAML. CD-026 says as much: the name records the
# job's place in the pipeline, not its contents.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security.yml
    with:
      language: python
      package-manager: pip
      sbom: true

  # The TypeScript branch needs exercising here too, or a change to it
  # reaches consumers untested — which is how the osv-scanner swap in v2
  # would otherwise have gone out. This repo carries no lockfile, so what
  # this covers is the preflight skip path rather than a real scan. That
  # is the case most likely to break silently, and the cheapest place to
  # find out is here.
  test:
    uses: ./.github/workflows/security.yml
    with:
      language: typescript
      sbom: false

  # CD-025: needs the security job, not just the work job. A release that
  # lists only `test` goes out whether or not the scan passed.
  release:
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release reads the tag history to decide the next
          # version, and move-major-tag.sh pushes a tag of its own.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install semantic-release plugins
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/exec \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/npm \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
