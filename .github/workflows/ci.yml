# This repo runs the shared workflow against itself on every pull request
# and every push to dev or main, so a change to security.yml is exercised
# before any consumer picks it up.
#
# Job names are canonical per ecosystem-standards CD-026: security, test,
# release. `test` is self-test.yml, because that is what it is: the work job
# of a repo whose only artifact is workflow YAML is the one that exercises
# that YAML. It runs the workflow static analysis, the TypeScript branch of
# the security workflow, and the pipeline's stages against one fixture per
# profile. CD-026 says as much: the name records the job's place in the
# pipeline, not its contents.
name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
    with:
      language: python
      package-manager: pip
      sbom: true
      # Proves the GitHub advisory pass against known advisories, so a
      # change to it is caught here rather than by a consumer passing a
      # lock it should have failed.
      self-test: true

  # Workflow static analysis, and the pipeline against every profile's
  # fixture (self-test.yml). The release needs this job, so a failing
  # fixture or a new high-severity workflow finding blocks the release.
  #
  # id-token and packages write reach it only because GitHub checks a
  # reusable workflow's permissions before any job's `if`: the deploy
  # stage's live Lambda and Railway paths ask for them, and the self-test
  # runs that stage against a stand-in that never takes those paths.
  test:
    uses: ./.github/workflows/self-test.yml
    permissions:
      contents: read
      id-token: write
      packages: write

  # CD-025: needs the security job, not just the work job. A release that
  # lists only `test` goes out whether or not the scan passed.
  #
  # Calls the local release.yml rather than the published tag, like the
  # security self-calls above, so a change to the release workflow or its
  # locked tooling is exercised by this repo's own release first.
  release:
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
    # main's ruleset lets only the promote App push past its pull-request
    # rule, so the release pushes its commit and tag as the App.
    secrets:
      app-client-id: ${{ secrets.PROMOTE_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.PROMOTE_APP_PRIVATE_KEY }}

  # Conformance is graded on every push to main once CI passes, before the
  # release (CD-031), so a promotion that cuts no release (docs or chore
  # commits only) is graded too. Nothing waits for the answer: the job
  # reports whether the request landed, never what was found.
  #
  # Like the security jobs above, it calls the local file rather than the
  # published tag, so a change to evaluate.yml is exercised against the
  # real API here before anyone meets it in their own pipeline.
  evaluate:
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # evaluate.yml checks nothing out and asks for no permission.
    permissions: {}
    uses: ./.github/workflows/evaluate.yml
    secrets:
      api-key: ${{ secrets.CI_VALIDATOR_API_KEY }}
