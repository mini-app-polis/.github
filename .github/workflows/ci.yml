# This repo runs the shared workflow against itself on every pull request,
# so a change to security.yml is exercised before any consumer picks it up.
#
# Job names are canonical per ecosystem-standards CD-026: security, test,
# release. The TypeScript self-call is named `test` because that is what it
# is — the work job of a repo whose only artifact is workflow YAML is the
# one that exercises that YAML. CD-026 says as much: the name records the
# job's place in the pipeline, not its contents.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security.yml
    with:
      language: python
      package-manager: pip
      sbom: true
      # Proves the GitHub advisory pass against known advisories, so a
      # change to it is caught here rather than by a consumer passing a
      # lock it should have failed.
      self-test: true

  # The TypeScript branch needs exercising here too, or a change to it
  # reaches consumers untested — which is how the osv-scanner swap in v2
  # would otherwise have gone out. The only Node lockfile here is the
  # release tooling's, in .github/actions/semantic-release, so this job is
  # also the audit of what every repo's release installs.
  test:
    uses: ./.github/workflows/security.yml
    with:
      language: typescript
      sbom: false

  # CD-025: needs the security job, not just the work job. A release that
  # lists only `test` goes out whether or not the scan passed.
  #
  # Calls the local release.yml rather than the published tag, like the
  # security self-calls above, so a change to the release workflow or its
  # locked tooling is exercised by this repo's own release first.
  release:
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/release.yml

  # This repo asks for its own conformance evaluation like any other, and
  # like the security jobs above it calls the local file rather than the
  # published tag. A change to evaluate.yml is therefore exercised against
  # the real API here — after the release, so it cannot hold a bad version
  # back, but before anyone reports it as a mystery failure in their own
  # pipeline. That is the same reason the security self-calls exist.
  evaluate:
    needs: release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/evaluate.yml
    secrets:
      api-key: ${{ secrets.CI_VALIDATOR_API_KEY }}
