# The fleet's shared `test` stage for a uv-managed Python repo.
#
# The union of what the cogs ran inline, so that no caller loses a check by
# adopting it: the lock agrees with pyproject (CD-020), lint, format, and the
# suite with coverage. evaluator-cog checked formatting and deejay-cog did
# not; deejay-cog checked the lock with a full clone and evaluator-cog did
# not need one. One file stops that drift.
#
# Usage, as the `test` job in a repo's ci.yml (CD-026):
#
#   test:
#     uses: mini-app-polis/.github/.github/workflows/python-test.yml@v3

name: python-test

on:
  workflow_call:
    inputs:
      python-version:
        description: "Match the runtime the repo deploys to — for a Lambda cog, infra/worker.tf's `runtime`."
        type: string
        default: "3.11"
      pytest-args:
        description: "Appended to the pytest command."
        type: string
        default: "--cov=src --cov-report=term-missing"
      typecheck:
        description: >-
          A type-check command, e.g. "uv run mypy src/". Empty skips the step.
          TEST-012 requires one in CI for a repo that declares [tool.mypy];
          a repo that does not declare it has nothing to run.
        type: string
        default: ""
      terraform-dir:
        description: >-
          A Lambda cog's Terraform directory, e.g. "infra". Set, it is checked
          with `terraform fmt -check` and `terraform validate` — no state, no
          credentials, no plan. Empty skips both. Applying stays on a
          workstation; see each cog's infra/README.md.
        type: string
        default: ""
      terraform-version:
        description: "Match what applies it from the workstation, so fmt agrees."
        type: string
        default: "1.16.2"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      WORKFLOW_VERSION: v3
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: |
          echo "python-test.yml ${WORKFLOW_VERSION}: python ${{ inputs.python-version }}"
          uv python install "${{ inputs.python-version }}"

      # CD-020. `uv sync` without --locked silently re-resolves when the
      # lockfile and pyproject.toml disagree, so a stale lock passes CI and
      # then ships something else. Checked here because this is where the
      # failure is cheap to fix — and the deploy builds from this same lock.
      - name: Verify the lockfile matches pyproject
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --all-extras --python "${{ inputs.python-version }}"

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Type check
        if: inputs.typecheck != ''
        run: ${{ inputs.typecheck }}

      - name: Set up Terraform
        if: inputs.terraform-dir != ''
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}
          # Plain terraform output; the wrapper only matters for steps that
          # read stdout as outputs, and none here do.
          terraform_wrapper: false

      # -backend=false: validate needs the providers' schemas, not state. The
      # committed .terraform.lock.hcl pins the versions, so this installs what
      # the workstation applies with.
      #
      # Not -lockfile=readonly. The lock is written on a Mac and holds that
      # platform's h1: hash plus the registry's zh: hashes. init verifies the
      # Linux download against zh:, then validate checks the unpacked plugin
      # against h1: — which readonly had stopped init recording — and fails.
      # Letting init add the Linux hash to the runner's copy changes no
      # version; the versions are still the lock's.
      - name: Terraform fmt and validate
        if: inputs.terraform-dir != ''
        env:
          TF_DIR: ${{ inputs.terraform-dir }}
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIR" fmt -check -recursive -diff
          terraform -chdir="$TF_DIR" init -backend=false -input=false
          terraform -chdir="$TF_DIR" validate

      - name: Test
        run: uv run pytest ${{ inputs.pytest-args }}
