# The fleet's shared `test` stage for a uv-managed Python repo.
#
# The union of what the cogs ran inline, so that no caller loses a check by
# adopting it: the lock agrees with pyproject (CD-020), lint, format, the
# type check, and the suite with coverage. evaluator-cog checked formatting
# and deejay-cog did not; deejay-cog checked the lock with a full clone and
# evaluator-cog did not need one. One file stops that drift.
#
# The checks live in the python-checks action (.github/actions/python-checks),
# which the agent's workflow also runs on an agent's change before it opens a
# pull request, so an agent is held to exactly this stage.
#
# Usage, as the `test` job in a repo's ci.yml (CD-026):
#
#   test:
#     uses: mini-app-polis/.github/.github/workflows/python-test.yml@v3

name: python-test

on:
  workflow_call:
    inputs:
      python-version:
        description: "Match the runtime the repo deploys to — for a Lambda cog, infra/worker.tf's `runtime`."
        type: string
        default: "3.11"
      pytest-args:
        description: "Appended to the pytest command."
        type: string
        default: "--cov=src --cov-report=term-missing"
      typecheck:
        description: >-
          A type-check command, e.g. "uv run mypy src/". TEST-012 requires
          one for every Python repo in scope, with [tool.mypy] declared in
          pyproject.toml. Empty skips the step and raises a warning saying so
          — it used to skip in silence, which is how a repo that adopted this
          workflow went untyped with nothing to show for it.
        type: string
        default: ""
      terraform-dir:
        description: >-
          A Lambda cog's Terraform directory, e.g. "infra". Set, it is checked
          with `terraform fmt -check` and `terraform validate` — no state, no
          credentials, no plan. Empty skips both. Applying stays on a
          workstation; see each cog's infra/README.md.
        type: string
        default: ""
      terraform-version:
        description: "Match what applies it from the workstation, so fmt agrees."
        type: string
        default: "1.16.2"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      WORKFLOW_VERSION: v3
    steps:
      - uses: actions/checkout@v7

      - name: Show the workflow version
        run: |
          echo "python-test.yml ${WORKFLOW_VERSION}: python ${{ inputs.python-version }}"

      - name: Test stage
        uses: mini-app-polis/.github/.github/actions/python-checks@v3
        with:
          python-version: ${{ inputs.python-version }}
          pytest-args: ${{ inputs.pytest-args }}
          typecheck: ${{ inputs.typecheck }}
          terraform-dir: ${{ inputs.terraform-dir }}
          terraform-version: ${{ inputs.terraform-version }}
