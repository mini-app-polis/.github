# The fleet's shared security workflow.
#
# Every repo in mini-app-polis may either carry its own secret scan,
# dependency audit, SAST and SBOM steps, or call this workflow and get
# all four. Neither shape is required — ecosystem-standards SEC-002
# through SEC-005 accept both — but calling this one means the tooling,
# the pinned versions and the gating decisions live in one place instead
# of being copied into every repo and drifting.
#
# The steps here are evaluated in their own right: this repo is
# registered in ecosystem.yaml, so the conformance run checks the
# workflow once rather than once per consumer.
#
# Action majors match the rest of the fleet: checkout@v6, setup-uv@v7,
# setup-node@v6, setup-python@v6.
#
# Usage, in a consumer's .github/workflows/ci.yml:
#
#   jobs:
#     security:
#       uses: mini-app-polis/.github/.github/workflows/security.yml@v1
#       with:
#         language: python
#         package-manager: uv

name: security

on:
  workflow_call:
    inputs:
      language:
        description: "python | typescript — selects the dependency audit and SAST tooling."
        type: string
        default: python
      package-manager:
        description: "uv | pip — how Python dependencies are resolved before the audit. Ignored for TypeScript: osv-scanner reads the lockfile directly."
        type: string
        default: uv
      own-package-prefix:
        description: "Name prefix of the fleet's own published libraries. They are left out of a consumer's audit: each is audited in its own repository."
        type: string
        default: "miniapppolis-"
      sbom:
        description: "Generate a CycloneDX SBOM and retain it as a build artifact."
        type: boolean
        default: true
      gitleaks-version:
        description: "Pinned gitleaks release. Installed from the published binary, not an action."
        type: string
        default: "8.28.0"
      syft-version:
        description: "Pinned syft release, used only when `sbom` is true."
        type: string
        default: "1.29.1"
      osv-scanner-version:
        description: "Pinned osv-scanner release, used for the TypeScript dependency audit, and to list a lockfile's packages for the GitHub advisory pass."
        type: string
        default: "2.5.1"
      self-test:
        description: "Also prove the GitHub advisory pass against known advisories. For this repository's own CI; consumers leave it off."
        type: boolean
        default: false

permissions:
  contents: read

# SEC-003, second source. pip-audit and osv-scanner read PyPA's and OSV's
# advisories, which mirror GitHub's but can lag it: on 2026-10-24
# GHSA-cx6f-vjhg-g3cc (virtualenv, high) was in GitHub's database, and in
# Dependabot's alert, while both audits passed the same lock. This checker
# asks GitHub's reviewed advisory database (GET /advisories) about every
# locked package and fails on high or critical. It is defined once here and
# run by both dependency-audit jobs, after their own audit, as
# `python -c "$GHSA_AUDIT_PY" <pip|npm> <packages.tsv>`. It authenticates
# with the job's own GITHUB_TOKEN only for the rate limit (60 requests an
# hour unauthenticated, shared by every runner on an address); the endpoint
# needs no permission.
env:
  GHSA_AUDIT_PY: |
      """Check pinned dependencies against GitHub's reviewed advisory database.

      Usage: python -c "$GHSA_AUDIT_PY" <pip|npm> <packages.tsv>

      Each line of packages.tsv is "name<TAB>version". A locked package with a
      reviewed advisory at high or critical severity fails the check; lower
      severities are listed and do not gate.

      GitHub matches package names exactly, and the database spells one project
      more than one way (``Django`` and ``django``, ``PyYAML`` and ``pyyaml`` carry
      different advisories), so a Python package is asked about under its lock
      name, its normalized name and its PyPI display name. npm names are
      lowercase by rule and are asked about as they are.

      An empty package list, or a source that cannot be reached after three
      attempts, fails the check rather than passing it unchecked.

        GH_TOKEN             sent if set, for the authenticated rate limit
        GHSA_API_URL         the advisories endpoint (default: GitHub's)
        GHSA_PYPI_URL        PyPI's JSON API (default: pypi.org)
        GHSA_RETRY_SECONDS   wait between attempts (default: 20)
      """

      from __future__ import annotations

      import json
      import os
      import re
      import sys
      import time
      import urllib.error
      import urllib.parse
      import urllib.request
      from concurrent.futures import ThreadPoolExecutor

      from packaging.specifiers import InvalidSpecifier, SpecifierSet
      from packaging.version import InvalidVersion, Version

      API = os.environ.get("GHSA_API_URL") or "https://api.github.com/advisories"
      PYPI = os.environ.get("GHSA_PYPI_URL") or "https://pypi.org/pypi"
      RETRY_SECONDS = float(os.environ.get("GHSA_RETRY_SECONDS") or 20)
      GATING = ("critical", "high")
      #: package@version pairs per request: well inside the URL length limit.
      BATCH = 80


      def normalize(ecosystem: str, name: str) -> str:
          if ecosystem == "pip":
              return re.sub(r"[-_.]+", "-", name).lower()
          return name


      def get(url: str, *, github: bool) -> tuple[object, str]:
          """GET JSON, three attempts. Exits the check if every attempt fails."""
          headers = {"User-Agent": "mini-app-polis-security", "Accept": "application/json"}
          if github:
              headers["Accept"] = "application/vnd.github+json"
              headers["X-GitHub-Api-Version"] = "2022-11-28"
              token = os.environ.get("GH_TOKEN")
              if token:
                  headers["Authorization"] = f"Bearer {token}"
          last: Exception | None = None
          for attempt in range(1, 4):
              try:
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response), response.headers.get("Link", "")
              except urllib.error.HTTPError as exc:
                  last = exc
                  # A refusal other than a rate limit will not change on a retry.
                  if exc.code < 500 and exc.code not in (403, 429):
                      break
              except (urllib.error.URLError, TimeoutError, ValueError) as exc:
                  last = exc
              if attempt < 3:
                  time.sleep(RETRY_SECONDS)
          where = "GitHub's advisory database" if github else "PyPI"
          print(f"::error::{where} could not be read ({last}): failing rather than "
                "passing unchecked.")
          sys.exit(1)


      def display_name(name: str, version: str) -> str:
          """The project's name as PyPI displays it, e.g. ``PyYAML``."""
          url = f"{PYPI}/{urllib.parse.quote(name)}/{urllib.parse.quote(version)}/json"
          data, _ = get(url, github=False)
          return str(data["info"]["name"])  # type: ignore[index]


      def spellings(ecosystem: str, name: str, version: str) -> set[str]:
          if ecosystem != "pip":
              return {name}
          shown = display_name(name, version)
          names = {name, normalize("pip", name), shown}
          names |= {n.replace("-", "_") for n in names} | {n.replace("_", "-") for n in names}
          return names


      def affected(version: str, vulnerable_range: str | None) -> bool:
          """Whether ``version`` is in GitHub's range, e.g. ``>= 1.0, < 1.2.3``."""
          if not vulnerable_range:
              return True
          parts = [p.strip().replace(" ", "") for p in vulnerable_range.split(",")]
          spec = ",".join("=" + p if re.match(r"=[^=]", p) else p for p in parts)
          try:
              return Version(version) in SpecifierSet(spec, prereleases=True)
          except (InvalidSpecifier, InvalidVersion):
              # GitHub matched the package and version already; trust that.
              return True


      def patched(vulnerability: dict) -> str:
          fix = vulnerability.get("first_patched_version")
          if isinstance(fix, dict):
              fix = fix.get("identifier")
          return str(fix) if fix else "none"


      def advisories(ecosystem: str, pairs: list[str]) -> dict[str, dict]:
          """Every reviewed advisory affecting any of ``pairs``, by GHSA id."""
          found: dict[str, dict] = {}
          for start in range(0, len(pairs), BATCH):
              query = urllib.parse.urlencode(
                  {
                      "ecosystem": ecosystem,
                      "affects": ",".join(pairs[start : start + BATCH]),
                      "per_page": 100,
                  }
              )
              url: str | None = f"{API}?{query}"
              while url:
                  page, link = get(url, github=True)
                  for advisory in page:  # type: ignore[union-attr]
                      found[advisory["ghsa_id"]] = advisory
                  nxt = re.search(r'<([^>]+)>;\s*rel="next"', link)
                  url = nxt[1] if nxt else None
          return found


      def main(ecosystem: str, path: str) -> int:
          packages: dict[str, tuple[str, set[str]]] = {}
          with open(path) as handle:
              for line in handle:
                  if not line.strip():
                      continue
                  name, version = line.rstrip("\n").split("\t")
                  key = normalize(ecosystem, name)
                  packages.setdefault(key, (name, set()))[1].add(version)
          if not packages:
              print("::error::No packages to check against GitHub's advisory database. "
                    "The check would pass vacuously; failing instead.")
              return 1

          locked = [(name, v) for name, versions in packages.values() for v in versions]
          with ThreadPoolExecutor(max_workers=8) as pool:
              names = list(pool.map(lambda nv: spellings(ecosystem, *nv), locked))
          pairs = sorted({f"{n}@{v}" for (_, v), ns in zip(locked, names) for n in ns})

          findings: list[tuple[str, str, str, str, str]] = []
          for ghsa_id, advisory in sorted(advisories(ecosystem, pairs).items()):
              severity = str(advisory.get("severity") or "unknown")
              for vulnerability in advisory.get("vulnerabilities") or []:
                  package = vulnerability.get("package") or {}
                  if package.get("ecosystem") != ecosystem:
                      continue
                  entry = packages.get(normalize(ecosystem, str(package.get("name"))))
                  if entry is None:
                      continue
                  name, versions = entry
                  for version in sorted(versions):
                      if affected(version, vulnerability.get("vulnerable_version_range")):
                          row = (name, version, ghsa_id, severity, patched(vulnerability))
                          if row not in findings:
                              findings.append(row)

          print(f"Checked {len(locked)} locked {ecosystem} packages against GitHub's "
                "reviewed advisory database.")
          gating = [f for f in findings if f[3] in GATING]
          if findings:
              print(f"{'Name':<32} {'Version':<16} {'ID':<22} {'Severity':<9} Fix Versions")
              for name, version, ghsa_id, severity, fix in findings:
                  print(f"{name:<32} {version:<16} {ghsa_id:<22} {severity:<9} {fix}")
          for name, version, ghsa_id, severity, fix in gating:
              print(f"::error::{name} {version} has {ghsa_id} ({severity}); "
                    f"first patched version {fix}.")
          if gating:
              return 1
          if findings:
              print("Only advisories below high severity: not gating.")
          return 0


      if __name__ == "__main__":
          sys.exit(main(sys.argv[1], sys.argv[2]))

jobs:
  # SEC-001 / SEC-002. Gating: a detected secret fails the build. The
  # binary is installed from a pinned release rather than an action so
  # the same command runs here and in the pre-commit hook.
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download"
          curl -sSfL "${url}/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan history for secrets
        run: gitleaks detect --source . --redact --no-banner --exit-code 1

  # SEC-003. Gating: a vulnerable resolved dependency fails the build.
  # The severity threshold is deliberately not passed here — the flag
  # spellings differ between the tools and change between versions, and
  # SEC-006 declares the response deadlines in the catalog instead.
  dependency-audit:
    name: dependency audit (python)
    if: inputs.language == 'python'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        if: inputs.language == 'python' && inputs.package-manager == 'uv'
        uses: astral-sh/setup-uv@v7

      - name: Audit Python dependencies
        if: inputs.language == 'python'
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          OWN_PREFIX: ${{ inputs.own-package-prefix }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pip-audit

          # No manifest means no dependency set belonging to this repo.
          # pip-audit with no --requirement audits the *runner's* ambient
          # environment instead, reporting whatever GitHub ships in its
          # image — findings this repo did not cause and cannot fix.
          # Skip loudly rather than manufacture that noise.
          if [ ! -f pyproject.toml ] && [ ! -f requirements.txt ]; then
            echo "No pyproject.toml or requirements.txt — this repo declares no Python dependencies, so there is nothing to audit."
            exit 0
          fi

          REQ=/tmp/audit-requirements.txt
          if [ "${PACKAGE_MANAGER}" = "uv" ]; then
            uv export --format requirements-txt --no-hashes --all-extras > "${REQ}"
          elif [ -f requirements.txt ]; then
            cp requirements.txt "${REQ}"
          else
            # pyproject.toml resolved by pip: install into a throwaway
            # environment so the audit sees the versions a build would
            # get, not the runner's preinstalled packages.
            python -m venv /tmp/auditenv
            /tmp/auditenv/bin/pip install --quiet --upgrade pip
            /tmp/auditenv/bin/pip install --quiet .
            /tmp/auditenv/bin/pip freeze --exclude-editable > "${REQ}"
          fi

          # Three kinds of line are removed before auditing, all because
          # --strict treats "not on PyPI" as a hard error:
          #
          #  1. The project itself. `uv export` emits `-e .`; the project
          #     is what is being audited, not one of its inputs.
          #  2. Dependencies pulled from git — the fleet's own internal
          #     libraries. They are not published to PyPI and never will
          #     be, and they are audited in their own repos, which run
          #     this same workflow. Auditing them here would double-count
          #     if it worked at all.
          #  3. The fleet's own published libraries (OWN_PREFIX), for the
          #     same reason as 2, and because a consumer's lock is bumped
          #     the moment one is released: pip-audit re-resolves through
          #     pip, and a PyPI CDN edge that does not list the new version
          #     yet fails the audit with "no matching distribution". Their
          #     own dependencies are still in this export and still audited.
          #
          # Everything dropped is printed, so the exclusion is visible in
          # the log rather than a silent hole in the audit.
          EXCLUDED='^[[:space:]]*(-e[[:space:]]|\.[[:space:]]*$)|@[[:space:]]+(git|file|https?)\+?'
          if [ -n "${OWN_PREFIX}" ]; then
            EXCLUDED="${EXCLUDED}|^[[:space:]]*${OWN_PREFIX}"
          fi
          if grep -qE "${EXCLUDED}" "${REQ}"; then
            echo "Excluded from the audit (not resolvable on PyPI, or audited in their own repositories):"
            grep -E "${EXCLUDED}" "${REQ}" | sed 's/^/  /'
          fi
          grep -vE "${EXCLUDED}" "${REQ}" > "${REQ}.kept" || true
          mv "${REQ}.kept" "${REQ}"

          COUNT=$(grep -cvE '^[[:space:]]*(#|$)' "${REQ}" || true)
          # An empty requirements file audits cleanly and proves nothing.
          # `set -e` catches a resolver that *fails*; this catches one that
          # succeeds and produces nothing, which would otherwise be
          # indistinguishable from a repo with no vulnerabilities.
          if [ "${COUNT}" -eq 0 ]; then
            echo "::error::Resolved 0 dependencies from a repo that has a manifest. The audit would pass vacuously; failing instead."
            exit 1
          fi

          echo "Auditing ${COUNT} resolved dependencies."
          # One request per dependency to PyPI's JSON API, each with a
          # 15-second default read timeout; one slow response failed the
          # whole audit with a traceback and no finding. A longer timeout,
          # and up to three attempts. A real vulnerability fails every
          # attempt the same way, so retrying cannot let one through.
          PIP_AUDIT=1
          for attempt in 1 2 3; do
            if pip-audit --requirement "${REQ}" --strict --timeout 60; then
              PIP_AUDIT=0
              break
            fi
            echo "pip-audit attempt ${attempt} failed."
            [ "${attempt}" -lt 3 ] && sleep 20
          done

          # The same dependency set, asked of GitHub's advisory database
          # (GHSA_AUDIT_PY, above). It runs whatever pip-audit found, so
          # one log shows both sources. Only pinned lines can be checked;
          # any other is printed rather than silently passed.
          PKGS=/tmp/audit-packages.tsv
          PINNED='^[[:space:]]*([A-Za-z0-9._-]+)(\[[^]]*\])?==([^[:space:];]+)'
          sed -nE "s/${PINNED}.*/\1\t\3/p" "${REQ}" > "${PKGS}"
          if grep -vE "${PINNED}|^[[:space:]]*(#|$)" "${REQ}" > /tmp/audit-unpinned.txt; then
            echo "Not pinned, so not checked against GitHub's advisory database:"
            sed 's/^/  /' /tmp/audit-unpinned.txt
          fi
          GHSA=0
          python -c "${GHSA_AUDIT_PY}" pip "${PKGS}" || GHSA=$?
          [ "${PIP_AUDIT}" -eq 0 ] && [ "${GHSA}" -eq 0 ]

      # self-test only: the pass above is proven against advisories that
      # are known to exist, and against the two ways it must fail rather
      # than pass. A finding it should make that it does not is a failure.
      - name: Prove the GitHub advisory pass
        if: inputs.self-test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          expect() {  # expect <label> <id or -> <python -c args...>
            label="$1"; want="$2"; shift 2
            out="$(python -c "${GHSA_AUDIT_PY}" "$@" 2>&1)"; code=$?
            while IFS= read -r line; do echo "  [${label}] ${line}"; done <<< "${out}"
            if [ "${code}" -eq 0 ]; then
              echo "::error::${label}: passed, and should have failed."; return 1
            fi
            if [ "${want}" != "-" ] && ! grep -q "${want}" <<< "${out}"; then
              echo "::error::${label}: did not report ${want}."; return 1
            fi
          }
          printf 'virtualenv\t21.14.10\n' > /tmp/st-virtualenv.tsv
          printf 'pyyaml\t5.3\n' > /tmp/st-pyyaml.tsv
          printf 'lodash\t4.17.15\n' > /tmp/st-lodash.tsv
          : > /tmp/st-empty.tsv
          ok=0
          expect "GitHub-only advisory" GHSA-cx6f-vjhg-g3cc pip /tmp/st-virtualenv.tsv || ok=1
          # Stored as PyYAML; the lock says pyyaml.
          expect "name spelled differently" GHSA-8q59-q68h-6hv4 pip /tmp/st-pyyaml.tsv || ok=1
          expect "npm" GHSA-35jh-r3h4-6jhm npm /tmp/st-lodash.tsv || ok=1
          expect "nothing to check" - pip /tmp/st-empty.tsv || ok=1
          GHSA_API_URL=https://127.0.0.1:9/advisories GHSA_RETRY_SECONDS=0 \
            expect "source unreachable" - npm /tmp/st-lodash.tsv || ok=1
          exit "${ok}"

  # SEC-003 (TypeScript). `pnpm audit` and `npm audit` both POST the
  # resolved tree to npm's advisory endpoint, which returned zero bytes
  # across three CI runs in two repos while the registry itself served
  # metadata in under 100ms and npm's status page reported no incident.
  # A raw curl reproduces it with no package manager involved. A scanner
  # that cannot reach its database cannot gate anything, and that one
  # failed as a silent hang rather than a message.
  #
  # osv-scanner reads the committed lockfile and queries OSV.dev — the
  # same shape as the Python path above. SEC-003 permits this directly:
  # "the requirement is that the ecosystem's installed dependency graph
  # is checked against a vulnerability database on every change, not that
  # a particular tool does it."
  #
  # Installed from the published binary rather than called as a reusable
  # workflow, matching gitleaks and syft above. The reusable workflow
  # declares `security-events: write` for a SARIF upload, which exceeds
  # this workflow's `contents: read` cap — job permissions can narrow but
  # never widen, so that form is rejected at validation before any job
  # runs. The upload also needs Advanced Security on private repos, which
  # the fleet does not have.
  #
  # The asset URL is resolved from the release API rather than
  # constructed, so a change to the naming convention fails loudly here
  # instead of 404-ing mid-install.
  dependency-audit-node:
    name: dependency audit (node)
    if: inputs.language == 'typescript'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install osv-scanner
        env:
          OSV_VERSION: ${{ inputs.osv-scanner-version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/google/osv-scanner/releases/tags/v${OSV_VERSION}"
          url="$(curl -sSfL -H "Authorization: Bearer ${GH_TOKEN}" "${api}" \
                 | jq -r '.assets[].browser_download_url
                          | select(test("linux[_-]amd64([.]tar[.]gz)?$"))' \
                 | head -1)"
          if [ -z "${url}" ]; then
            echo "::error::No linux/amd64 asset found for osv-scanner v${OSV_VERSION}."
            exit 1
          fi
          echo "Installing ${url}"
          case "${url}" in
            *.tar.gz) curl -sSfL "${url}" | sudo tar -xz -C /usr/local/bin osv-scanner ;;
            *)        sudo curl -sSfL "${url}" -o /usr/local/bin/osv-scanner ;;
          esac
          sudo chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Audit Node dependencies
        id: osv
        run: |
          set -euo pipefail

          # The same "nothing to audit" guard the pnpm path carried: a
          # repo with no lockfile declares no Node dependencies. Kept as
          # a step rather than a preflight job so there is no cross-job
          # output to thread. No pipe into `grep -q` here — under
          # `pipefail` that races with SIGPIPE and can report absence
          # when a lockfile is present.
          FOUND=""
          for name in pnpm-lock.yaml package-lock.json npm-shrinkwrap.json yarn.lock; do
            HIT="$(find . -name node_modules -prune -o -name "${name}" -print -quit)"
            if [ -n "${HIT}" ]; then
              FOUND="${HIT}"
              break
            fi
          done

          if [ -z "${FOUND}" ]; then
            echo "No lockfile found — this repo declares no Node dependencies, so there is nothing to audit."
            exit 0
          fi

          echo "Found ${FOUND} — scanning."
          echo "lockfile=${FOUND}" >> "${GITHUB_OUTPUT}"
          osv-scanner scan --recursive ./

      - name: Set up Python
        if: ${{ !cancelled() && steps.osv.outputs.lockfile != '' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # GHSA_AUDIT_PY (above) over the packages osv-scanner reads from the
      # lockfiles. Runs whatever osv-scanner found, so one log shows both
      # sources. The listing is offline: it needs no vulnerability source,
      # and osv-scanner's exit code there only says it had none. An empty
      # list fails the check rather than passing it.
      - name: Check Node dependencies against GitHub's advisory database
        if: ${{ !cancelled() && steps.osv.outputs.lockfile != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install --quiet packaging
          osv-scanner scan source --recursive --all-packages --offline \
            --format json --output-file /tmp/osv-packages.json ./ > /dev/null 2>&1 || true
          python - <<'PY'
          import json
          try:
              results = json.load(open("/tmp/osv-packages.json"))["results"]
          except (OSError, ValueError, KeyError):
              results = []
          packages = sorted(
              {
                  (p["package"]["name"], p["package"]["version"])
                  for result in results
                  for p in result.get("packages", [])
                  if p["package"].get("ecosystem") == "npm"
              }
          )
          with open("/tmp/audit-packages.tsv", "w") as out:
              out.writelines(f"{name}\t{version}\n" for name, version in packages)
          print(f"Listed {len(packages)} npm packages from the lockfiles.")
          PY
          python -c "${GHSA_AUDIT_PY}" npm /tmp/audit-packages.tsv

  # SEC-004. Not gating, by design: SAST is noisy enough that a blocking
  # gate on day one gets switched off rather than fixed. The findings go
  # to the run log and the job is advisory.
  static-analysis:
    name: static analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run semgrep
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip semgrep
          semgrep scan --config auto --error --metrics off || true

  # SEC-005. Generation and upload are in the same job on purpose:
  # jobs do not share a filesystem, so an SBOM written in one job and an
  # artifact uploaded in another leaves no SBOM behind.
  sbom:
    name: sbom
    runs-on: ubuntu-latest
    if: inputs.sbom
    steps:
      - uses: actions/checkout@v7

      - name: Install syft
        env:
          SYFT_VERSION: ${{ inputs.syft-version }}
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/anchore/syft/main/install.sh"
          curl -sSfL "${url}" | sh -s -- -b /usr/local/bin "v${SYFT_VERSION}"
          syft version

      - name: Generate SBOM
        run: syft dir:. -o cyclonedx-json=sbom.cyclonedx.json

      - name: Retain SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90
