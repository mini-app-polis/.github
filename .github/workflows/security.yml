# The fleet's shared security workflow.
#
# Every repo in mini-app-polis may either carry its own secret scan,
# dependency audit, SAST and SBOM steps, or call this workflow and get
# all four. Neither shape is required — ecosystem-standards SEC-002
# through SEC-005 accept both — but calling this one means the tooling,
# the pinned versions and the gating decisions live in one place instead
# of being copied into every repo and drifting.
#
# The steps here are evaluated in their own right: this repo is
# registered in ecosystem.yaml, so the conformance run checks the
# workflow once rather than once per consumer.
#
# Action majors match the rest of the fleet: checkout@v6, setup-uv@v7,
# setup-node@v6, setup-python@v6.
#
# Usage, in a consumer's .github/workflows/ci.yml:
#
#   jobs:
#     security:
#       uses: mini-app-polis/.github/.github/workflows/security.yml@v1
#       with:
#         language: python
#         package-manager: uv

name: security

on:
  workflow_call:
    inputs:
      language:
        description: "python | typescript — selects the dependency audit and SAST tooling."
        type: string
        default: python
      package-manager:
        description: "uv | pip | pnpm | npm — how dependencies are resolved before the audit."
        type: string
        default: uv
      sbom:
        description: "Generate a CycloneDX SBOM and retain it as a build artifact."
        type: boolean
        default: true
      gitleaks-version:
        description: "Pinned gitleaks release. Installed from the published binary, not an action."
        type: string
        default: "8.28.0"
      syft-version:
        description: "Pinned syft release, used only when `sbom` is true."
        type: string
        default: "1.29.1"

permissions:
  contents: read

jobs:
  # SEC-001 / SEC-002. Gating: a detected secret fails the build. The
  # binary is installed from a pinned release rather than an action so
  # the same command runs here and in the pre-commit hook.
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download"
          curl -sSfL "${url}/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan history for secrets
        run: gitleaks detect --source . --redact --no-banner --exit-code 1

  # SEC-003. Gating: a vulnerable resolved dependency fails the build.
  # The severity threshold is deliberately not passed here — the flag
  # spellings differ between the tools and change between versions, and
  # SEC-006 declares the response deadlines in the catalog instead.
  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        if: inputs.language == 'python' && inputs.package-manager == 'uv'
        uses: astral-sh/setup-uv@v7

      - name: Audit Python dependencies
        if: inputs.language == 'python'
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pip-audit

          # No manifest means no dependency set belonging to this repo.
          # pip-audit with no --requirement audits the *runner's* ambient
          # environment instead, reporting whatever GitHub ships in its
          # image — findings this repo did not cause and cannot fix.
          # Skip loudly rather than manufacture that noise.
          if [ ! -f pyproject.toml ] && [ ! -f requirements.txt ]; then
            echo "No pyproject.toml or requirements.txt — this repo declares no Python dependencies, so there is nothing to audit."
            exit 0
          fi

          REQ=/tmp/audit-requirements.txt
          if [ "${PACKAGE_MANAGER}" = "uv" ]; then
            uv export --format requirements-txt --no-hashes --all-extras > "${REQ}"
          elif [ -f requirements.txt ]; then
            cp requirements.txt "${REQ}"
          else
            # pyproject.toml resolved by pip: install into a throwaway
            # environment so the audit sees the versions a build would
            # get, not the runner's preinstalled packages.
            python -m venv /tmp/auditenv
            /tmp/auditenv/bin/pip install --quiet --upgrade pip
            /tmp/auditenv/bin/pip install --quiet .
            /tmp/auditenv/bin/pip freeze --exclude-editable > "${REQ}"
          fi

          # Two kinds of line are removed before auditing, both because
          # --strict treats "not on PyPI" as a hard error:
          #
          #  1. The project itself. `uv export` emits `-e .`; the project
          #     is what is being audited, not one of its inputs.
          #  2. Dependencies pulled from git — the fleet's own internal
          #     libraries. They are not published to PyPI and never will
          #     be, and they are audited in their own repos, which run
          #     this same workflow. Auditing them here would double-count
          #     if it worked at all.
          #
          # Everything dropped is printed, so the exclusion is visible in
          # the log rather than a silent hole in the audit.
          if grep -qE '^[[:space:]]*(-e[[:space:]]|\.[[:space:]]*$)|@[[:space:]]+(git|file|https?)\+?' "${REQ}"; then
            echo "Excluded from the audit (not resolvable on PyPI):"
            grep -E '^[[:space:]]*(-e[[:space:]]|\.[[:space:]]*$)|@[[:space:]]+(git|file|https?)\+?' "${REQ}" | sed 's/^/  /'
          fi
          sed -i -E '/^[[:space:]]*(-e[[:space:]]|\.[[:space:]]*$)/d; /@[[:space:]]+(git|file|https?)\+?/d' "${REQ}"

          COUNT=$(grep -cvE '^[[:space:]]*(#|$)' "${REQ}" || true)
          # An empty requirements file audits cleanly and proves nothing.
          # `set -e` catches a resolver that *fails*; this catches one that
          # succeeds and produces nothing, which would otherwise be
          # indistinguishable from a repo with no vulnerabilities.
          if [ "${COUNT}" -eq 0 ]; then
            echo "::error::Resolved 0 dependencies from a repo that has a manifest. The audit would pass vacuously; failing instead."
            exit 1
          fi

          echo "Auditing ${COUNT} resolved dependencies."
          pip-audit --requirement "${REQ}" --strict

      - name: Set up Node
        if: inputs.language == 'typescript'
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up pnpm
        if: inputs.language == 'typescript' && inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v5

      - name: Audit Node dependencies
        if: inputs.language == 'typescript'
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "No package.json — this repo declares no Node dependencies, so there is nothing to audit."
            exit 0
          fi
          if [ "${PACKAGE_MANAGER}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
            pnpm audit --audit-level moderate
          else
            npm ci
            npm audit --audit-level moderate
          fi

  # SEC-004. Not gating, by design: SAST is noisy enough that a blocking
  # gate on day one gets switched off rather than fixed. The findings go
  # to the run log and the job is advisory.
  static-analysis:
    name: static analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run semgrep
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip semgrep
          semgrep scan --config auto --error --metrics off || true

  # SEC-005. Generation and upload are in the same job on purpose:
  # jobs do not share a filesystem, so an SBOM written in one job and an
  # artifact uploaded in another leaves no SBOM behind.
  sbom:
    name: sbom
    runs-on: ubuntu-latest
    if: inputs.sbom
    steps:
      - uses: actions/checkout@v6

      - name: Install syft
        env:
          SYFT_VERSION: ${{ inputs.syft-version }}
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/anchore/syft/main/install.sh"
          curl -sSfL "${url}" | sh -s -- -b /usr/local/bin "v${SYFT_VERSION}"
          syft version

      - name: Generate SBOM
        run: syft dir:. -o cyclonedx-json=sbom.cyclonedx.json

      - name: Retain SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90
