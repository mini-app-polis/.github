# This repository's own test stage: ci.yml's `test` job calls it on every
# pull request and every push to main, and the release needs that job, so
# anything failing here blocks the release.
#
# It runs workflow static analysis on this repository, and runs the
# pipeline's stages against one fixture repository per profile (README,
# "Changing the pipeline"). The fixtures are directories under fixtures/,
# each holding only what its profile's stages need to run green.
#
# Fixtures never publish, tag a fleet repository, deploy or post an
# evaluation, and reach no network beyond package and container registries.
# The build stage uploads its artifact and SBOM to this run only, and saves
# the api-service image to a tarball rather than pushing it. The deploy
# stage runs with `target: fake`: its target is a record kept in this run,
# so it reads and changes nothing outside it. The verify stage runs with
# `target: fake` too: it polls a stand-in service on the job's loopback,
# posts its alarm there, and keeps its record in this run. The release
# stage runs only as a dry run, in a scratch repository whose one remote is
# a bare repository beside it; its re-run proof tags and pushes only there. No fixture names a contract suite, so the
# contract stage, which calls the development API, skips against every one
# and says so. The evaluation stages run with `target: fake`: the API they
# ask is a stand-in on the job's loopback with a key of its own, so no
# secret is read and no evaluation is posted.
#
# The fixture jobs call the stage workflows and actions that exist today.
# Once pipeline.yml exists, `stages`, `build`, `fixture` and the evaluate
# jobs become one matrix job that calls it for each profile, with the
# fixture's directory as its working directory; README, "Testing the
# pipeline", says what pipeline.yml needs for that.
name: self-test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # actionlint, zizmor and the timeout check over this repository's own
  # workflows.
  workflow-checks:
    uses: ./.github/workflows/workflow-checks.yml
    permissions:
      contents: read

  # The TypeScript branch of security.yml needs exercising here too, or a
  # change to it reaches consumers untested — which is how the osv-scanner
  # swap in v2 would otherwise have gone out. The only Node lockfile of this
  # repository's own is the release tooling's, in
  # .github/actions/semantic-release, so this job is also the audit of what
  # every repo's release installs.
  security-typescript:
    name: security (release tooling)
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
    with:
      language: typescript
      sbom: false

  # The stages before build (stages-test.yml: lint, unit, integration,
  # contract and security, and the `test` gate over them) against each
  # profile's fixture. A stage the profile has nothing for runs, says why in
  # its summary and passes.
  #
  # api-service's integration stage runs against the Postgres service
  # container the fleet's APIs use, and its fixture's integration test fails
  # rather than skips without one, so the container is proven every run. No
  # SBOM: it would be the fixture's, which nobody needs, and every call would
  # upload it under the same artifact name.
  stages:
    name: stages (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: python-service, postgres-image: "" }
          - { profile: api-service, postgres-image: "pgvector/pgvector:pg16" }
          - { profile: python-library, postgres-image: "" }
          - { profile: astro-site, postgres-image: "" }
          - { profile: npm-library, postgres-image: "" }
          - { profile: terraform-infra, postgres-image: "" }
          - { profile: shared-workflows, postgres-image: "" }
    uses: ./.github/workflows/stages-test.yml
    permissions:
      contents: read
    with:
      profile: ${{ matrix.profile }}
      working-directory: fixtures/${{ matrix.profile }}
      postgres-image: ${{ matrix.postgres-image }}
      postgres-database: fixture_test
      sbom: false

  # The build stage (stages-build.yml) against each profile's fixture, run
  # twice on one commit, and its artifact taken by digest as release and
  # deploy take it; then the deploy stage (stages-deploy.yml) against the
  # stand-in target, to each environment twice, and the verify stage
  # (stages-verify.yml) against a stand-in service, verifying what was
  # deployed and failing on a version that was not (self-test-build.yml
  # says how). terraform-infra and shared-workflows build nothing and say
  # why, and they and the libraries deploy nothing and say why. The
  # python-service fixture's handler is invoked on a schedule, so its Lambda
  # zip gets the import check rather than the queue probe.
  #
  # id-token, packages and statuses write are granted only because GitHub
  # checks a reusable workflow's permissions before any job's `if`: the
  # deploy and verify stages ask for them for their live paths (the Lambda,
  # GHCR and the commit status), which the stand-ins never take.
  build:
    name: build (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: python-service, lambda-handler: fixture_python_service.handler.lambda_handler, lambda-trigger: schedule }
          - { profile: api-service, lambda-handler: "", lambda-trigger: sqs }
          - { profile: python-library, lambda-handler: "", lambda-trigger: sqs }
          - { profile: astro-site, lambda-handler: "", lambda-trigger: sqs }
          - { profile: npm-library, lambda-handler: "", lambda-trigger: sqs }
          - { profile: terraform-infra, lambda-handler: "", lambda-trigger: sqs }
          - { profile: shared-workflows, lambda-handler: "", lambda-trigger: sqs }
    uses: ./.github/workflows/self-test-build.yml
    permissions:
      contents: read
      id-token: write
      packages: write
      statuses: write
    with:
      profile: ${{ matrix.profile }}
      lambda-handler: ${{ matrix.lambda-handler }}
      lambda-trigger: ${{ matrix.lambda-trigger }}

  # The check every stage after build runs on the artifact it takes, against
  # every way an artifact can be wrong, the planted digest mismatch included.
  # The build jobs above only ever see a matching digest.
  artifact-digest:
    name: artifact digest check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every case of a changed, missing or mismatched artifact fails
        run: bash scripts/test-artifact-digest.sh

  # The deploy stage's decisions, case by case: whether a run may deploy to
  # an environment, and whether the target already runs the version.
  deploy-decision:
    name: deploy decision check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every guard and skip case decides as it should
        run: bash scripts/test-deploy-decision.sh

  # The verify stage's decisions and probes, case by case: what counts as the
  # release, the backoff, a poll that verifies on a match and times out on
  # anything else, and each probe against a local stand-in for its target.
  verify-decision:
    name: verify decision check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every compare, poll and probe case decides as it should
        run: bash scripts/test-verify-decision.sh

  # The shared-workflows profile's lint stage is the static analysis above,
  # run on the fixture's workflows instead of this repository's.
  fixture-workflows:
    name: workflow checks (shared-workflows)
    uses: ./.github/workflows/workflow-checks.yml
    permissions:
      contents: read
    with:
      working-directory: fixtures/shared-workflows

  # The stages that run on a runner of their own against each fixture: the
  # release stage, run twice on one commit and re-run after each way it can
  # stop partway, and for the Python fixtures the
  # python-checks action as python-test.yml runs it, every check in one job,
  # since the fleet's callers of python-test.yml still use it that way.
  #
  # That is the local action, not python-test.yml: python-test.yml runs the
  # action from the published major, so it would test what is already
  # released rather than this change. The integration tests are left out:
  # they need the service container the integration stage starts.
  fixture:
    name: fixture (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: python-service, test: python-checks }
          - { profile: api-service, test: python-checks }
          - { profile: python-library, test: python-checks }
          - { profile: astro-site, test: "" }
          - { profile: npm-library, test: "" }
          - { profile: terraform-infra, test: "" }
          - { profile: shared-workflows, test: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every check, as python-test.yml runs them
        if: matrix.test == 'python-checks'
        uses: ./.github/actions/python-checks
        with:
          working-directory: fixtures/${{ matrix.profile }}
          typecheck: uv run mypy src/
          pytest-args: --ignore=tests/integration --cov=src --cov-report=term-missing

      # The same Node and the same lockfile the release action installs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install the locked release tooling
        working-directory: .github/actions/semantic-release
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: A second release run on a released commit releases nothing
        env:
          PROFILE: ${{ matrix.profile }}
        run: bash scripts/check-release-rerun.sh "fixtures/${PROFILE}" .github/actions/semantic-release

      # Release commit without its tag, tag without its GitHub release, major
      # tag not moved, and the reconciler's ref: each re-run finishes the
      # release with one tag and one release commit.
      - name: A re-run finishes a release that stopped partway
        env:
          PROFILE: ${{ matrix.profile }}
        run: bash scripts/check-release-resume.sh "fixtures/${PROFILE}" .github/actions/semantic-release

  # The evaluation stages' request and decisions, case by case: what
  # blocks a release and what passes it, the backoff, and the request and
  # poll against the stand-in API in each of its scenarios.
  evaluate-decision:
    name: evaluate decision check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every request, decide and poll case decides as it should
        run: bash scripts/test-evaluate-decision.sh

  # The evaluation stages (stages-evaluate.yml) against the stand-in API.
  # Evaluation asks about a commit, not a profile's build, so each case runs
  # once rather than per fixture. evaluate-pre passes on a clean evaluation,
  # and again when re-run on the same commit; it fails, so the release that
  # needs it would not run, on an ERROR and on an evaluation that never
  # finishes. evaluate-post asks for the published release and skips, asking
  # nothing, when nothing was published. The failing cases are
  # expect-failure: their failing step fails as a live one would and is let
  # through, and `evaluate` below reads their `outcome` to prove it.
  evaluate-pre-clean:
    uses: ./.github/workflows/stages-evaluate.yml
    permissions: {}
    with:
      phase: pre-release
      sha: ${{ github.sha }}
      target: fake
      fake-scenario: clean
      poll-initial-seconds: 1
      poll-max-seconds: 2

  evaluate-pre-again:
    needs: evaluate-pre-clean
    uses: ./.github/workflows/stages-evaluate.yml
    permissions: {}
    with:
      phase: pre-release
      sha: ${{ github.sha }}
      target: fake
      fake-scenario: clean
      poll-initial-seconds: 1
      poll-max-seconds: 2

  evaluate-pre-blocked:
    uses: ./.github/workflows/stages-evaluate.yml
    permissions: {}
    with:
      phase: pre-release
      sha: ${{ github.sha }}
      target: fake
      fake-scenario: blocking
      expect-failure: true
      poll-initial-seconds: 1
      poll-max-seconds: 2

  evaluate-pre-unfinished:
    uses: ./.github/workflows/stages-evaluate.yml
    permissions: {}
    with:
      phase: pre-release
      sha: ${{ github.sha }}
      target: fake
      fake-scenario: running
      expect-failure: true
      evaluate-timeout-seconds: 5
      poll-initial-seconds: 1
      poll-max-seconds: 2

  # What the release stage outputs, for a run that published a release and
  # for one that did not, so evaluate-post is wired as pipeline.yml wires it:
  # from release outputs in the same run.
  evaluate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      published: ${{ steps.release.outputs.published }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      unpublished: ${{ steps.release.outputs.unpublished }}
    steps:
      - name: A release, as the release stage reports one
        id: release
        run: |
          {
            echo "published=true"
            echo "version=1.2.3"
            echo "tag=v1.2.3"
            echo "sha=${GITHUB_SHA}"
            echo "unpublished=false"
          } >> "$GITHUB_OUTPUT"

  evaluate-post-published:
    needs: evaluate-release
    uses: ./.github/workflows/stages-evaluate.yml
    permissions: {}
    with:
      phase: post-release
      published: ${{ needs.evaluate-release.outputs.published }}
      version: ${{ needs.evaluate-release.outputs.version }}
      tag: ${{ needs.evaluate-release.outputs.tag }}
      sha: ${{ needs.evaluate-release.outputs.sha }}
      target: fake

  # A run that released nothing: the release stage leaves version and sha
  # empty.
  evaluate-post-unpublished:
    needs: evaluate-release
    uses: ./.github/workflows/stages-evaluate.yml
    permissions: {}
    with:
      phase: post-release
      published: ${{ needs.evaluate-release.outputs.unpublished }}
      version: ""
      sha: ""
      target: fake

  evaluate:
    name: evaluate stages check
    needs: [evaluate-pre-clean, evaluate-pre-again, evaluate-pre-blocked, evaluate-pre-unfinished, evaluate-post-published, evaluate-post-unpublished]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Passed when clean, blocked on an ERROR or no answer, skipped when unpublished
        env:
          CLEAN: ${{ needs.evaluate-pre-clean.outputs.result }}/${{ needs.evaluate-pre-clean.outputs.requested }}/${{ needs.evaluate-pre-clean.outputs.outcome }}
          AGAIN: ${{ needs.evaluate-pre-again.outputs.result }}/${{ needs.evaluate-pre-again.outputs.requested }}/${{ needs.evaluate-pre-again.outputs.outcome }}
          BLOCKED: ${{ needs.evaluate-pre-blocked.outputs.result }}/${{ needs.evaluate-pre-blocked.outputs.requested }}/${{ needs.evaluate-pre-blocked.outputs.outcome }}
          UNFINISHED: ${{ needs.evaluate-pre-unfinished.outputs.result }}/${{ needs.evaluate-pre-unfinished.outputs.requested }}/${{ needs.evaluate-pre-unfinished.outputs.outcome }}
          PUBLISHED: ${{ needs.evaluate-post-published.outputs.result }}/${{ needs.evaluate-post-published.outputs.requested }}/${{ needs.evaluate-post-published.outputs.outcome }}
          UNPUBLISHED: ${{ needs.evaluate-post-unpublished.outputs.result }}/${{ needs.evaluate-post-unpublished.outputs.requested }}/${{ needs.evaluate-post-unpublished.outputs.outcome }}
          CLEAN_RUN: ${{ needs.evaluate-pre-clean.outputs.run-id }}
          CLEAN_MESSAGE: ${{ needs.evaluate-pre-clean.outputs.message-id }}
        run: |
          set -euo pipefail
          failures=0
          expect() {
            if [ "$2" = "$3" ]; then echo "ok: $1 ($2)"; else echo "::error::$1: $2, wanted $3 (result/requested/outcome)"; failures=$((failures + 1)); fi
          }
          expect "pre-release passes a clean evaluation" "${CLEAN}" "pass/true/success"
          expect "pre-release asks again on a re-run, and passes" "${AGAIN}" "pass/true/success"
          expect "pre-release fails on an ERROR, so the release does not run" "${BLOCKED}" "blocked/true/failure"
          expect "pre-release fails closed when the evaluation never finishes" "${UNFINISHED}" "timeout/true/failure"
          expect "post-release asks for the published release" "${PUBLISHED}" "requested/true/success"
          expect "post-release skips, asking nothing, when nothing was published" "${UNPUBLISHED}" "skipped/false/success"
          [ -n "${CLEAN_RUN}" ] && [ -n "${CLEAN_MESSAGE}" ] && echo "ok: the pass names its run and request" \
            || { echo "::error::the pass did not name its run (${CLEAN_RUN:-none}) and request (${CLEAN_MESSAGE:-none})"; failures=$((failures + 1)); }
          [ "${failures}" -eq 0 ]

  # One result for the whole stage, so main's ruleset can require one check
  # whose name does not change as jobs are added above. It runs whatever
  # happened, and passes only if every job it needs passed.
  gate:
    name: gate
    if: always()
    needs: [workflow-checks, security-typescript, stages, build, artifact-digest, deploy-decision, verify-decision, evaluate-decision, evaluate, fixture-workflows, fixture]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every self-test job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "${NEEDS}"
          failed="$(jq '[to_entries[] | select(.value.result != "success")] | length' <<< "${NEEDS}")"
          if [ "${failed}" -ne 0 ]; then
            echo "::error::${failed} self-test job(s) did not pass."
            exit 1
          fi
