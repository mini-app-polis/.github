# The fleet's shared Lambda deploy: take a cog's zip, upload it, and prove
# what AWS holds is what was built.
#
# Terraform owns the function's configuration and is applied from a
# workstation (each cog's infra/). This owns the code only. The deploy role
# a cog passes can call UpdateFunctionCode and GetFunction(Configuration)
# and nothing else.
#
# The zip comes one of two ways:
#   - From the build stage, by `artifact-name` and `artifact-digest`: the
#     artifact stages-build.yml made for this commit, downloaded from the
#     run and refused unless its digest matches. Nothing is rebuilt, so
#     what deploys is what was tested. The build stage already ran the
#     zip's three guards; target.json in the artifact records what it was
#     built for, and a deploy for anything else is refused.
#   - From `ref`, as before: the zip is built here by the lambda-zip action,
#     the same action and the same three guards the build stage runs (its
#     header says why each exists).
#
# Usage, from a cog's ci.yml. Call it as a job after `release`, not with
# `on: release`: semantic-release publishes with GITHUB_TOKEN and GitHub
# starts no workflows from that token's events.
#
#   deploy:
#     needs: release
#     if: needs.release.outputs.tag != ''
#     permissions:
#       id-token: write
#       contents: read
#     uses: mini-app-polis/.github/.github/workflows/lambda-deploy.yml@v3
#     with:
#       ref: ${{ needs.release.outputs.tag }}
#       handler: deejay_cog.worker.lambda_handler
#       architecture: x86_64
#       role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
#       region: ${{ vars.AWS_REGION }}
#       function-name: ${{ vars.AWS_FUNCTION_NAME }}
#
# In the same run as the build stage, pass its outputs instead of `ref`:
#
#       artifact-name: ${{ needs.build.outputs.artifact-name }}
#       artifact-digest: ${{ needs.build.outputs.artifact-digest }}
#
# The actions are named with `$/`, which resolves to this repository at the
# commit of this file, so a caller pinned to a tag gets them from that tag.

name: lambda-deploy

on:
  workflow_call:
    inputs:
      ref:
        description: "The ref to build, the release tag when called from ci.yml. Not used, and may be empty, when artifact-name is given."
        type: string
        default: ""
      artifact-name:
        description: "The build stage's artifact-name output. With artifact-digest, deploy that artifact's zip instead of building one."
        type: string
        default: ""
      artifact-digest:
        description: "The build stage's artifact-digest output (sha256:<hex>). The artifact is refused unless it matches."
        type: string
        default: ""
      handler:
        description: "module.path.function, exactly as infra/worker.tf's `handler`. The module must be importable from the zip root."
        type: string
        required: true
      architecture:
        description: "x86_64 | arm64 — must match `architectures` in the cog's infra/worker.tf."
        type: string
        required: true
      trigger:
        description: "sqs | schedule — what invokes the function. sqs (a worker behind a queue) gets Guard 3's malformed-record probe; schedule (an EventBridge rule, e.g. watcher-cog) gets the import check only."
        type: string
        default: "sqs"
      python-version:
        description: "The Lambda runtime's Python, as in `runtime = \"python<version>\"`."
        type: string
        default: "3.14"
      strip:
        description: "Space-separated top-level paths to remove from the zip, for dependencies the cog never imports. Guard 3 fails the build if one is in fact imported. boto3 and its stack are always removed; the runtime provides them."
        type: string
        default: ""
      role-arn:
        description: "The cog's CI deploy role (terraform output deploy_role_arn)."
        type: string
        required: true
      region:
        type: string
        required: true
      function-name:
        type: string
        required: true

permissions:
  contents: read

env:
  # Package managers retry their own registry fetches with backoff; these
  # raise each one's attempt count so a registry blip is ridden out rather
  # than failing the stage.
  UV_HTTP_RETRIES: "5"
  PIP_RETRIES: "5"
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_mintimeout: "10000"
  npm_config_fetch_retry_maxtimeout: "60000"
  # The AWS CLI's standard retry mode backs off on throttling and transient
  # errors.
  AWS_RETRY_MODE: standard
  AWS_MAX_ATTEMPTS: "5"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # for OIDC; this is what replaces a long-lived key
      contents: read
    concurrency:
      group: lambda-deploy-${{ inputs.function-name }}
      cancel-in-progress: false
    env:
      HANDLER: ${{ inputs.handler }}
      ARCH: ${{ inputs.architecture }}
      PY: ${{ inputs.python-version }}
      STRIP: ${{ inputs.strip }}
      TRIGGER: ${{ inputs.trigger }}
      # Hand-maintained, bumped when a major tag is cut — see evaluate.yml
      # for why github.job_workflow_sha cannot stand in for it.
      WORKFLOW_VERSION: v3
    steps:
      - name: Resolve the source
        id: source
        env:
          REF: ${{ inputs.ref }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          ARTIFACT_DIGEST: ${{ inputs.artifact-digest }}
        run: |
          set -euo pipefail
          echo "lambda-deploy.yml ${WORKFLOW_VERSION}: ${HANDLER} on python${PY}/${ARCH}"
          if [ -n "${ARTIFACT_NAME}" ] || [ -n "${ARTIFACT_DIGEST}" ]; then
            if [ -z "${ARTIFACT_NAME}" ] || [ -z "${ARTIFACT_DIGEST}" ]; then
              echo "::error::artifact-name and artifact-digest go together: pass both of the build stage's outputs, or neither."
              exit 1
            fi
            echo "from=artifact" >> "$GITHUB_OUTPUT"
            echo "Deploying ${ARTIFACT_NAME} (${ARTIFACT_DIGEST}) from the build stage."
          elif [ -n "${REF}" ]; then
            echo "from=ref" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Nothing to deploy: pass ref, or the build stage's artifact-name and artifact-digest."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.source.outputs.from == 'ref'
        with:
          ref: ${{ inputs.ref }}

      - name: Build the zip
        id: built
        if: steps.source.outputs.from == 'ref'
        uses: $/.github/actions/lambda-zip
        with:
          handler: ${{ inputs.handler }}
          architecture: ${{ inputs.architecture }}
          trigger: ${{ inputs.trigger }}
          python-version: ${{ inputs.python-version }}
          strip: ${{ inputs.strip }}
          output-dir: ${{ runner.temp }}/lambda

      - name: Take the build stage's artifact
        id: artifact
        if: steps.source.outputs.from == 'artifact'
        uses: $/.github/actions/fetch-artifact
        with:
          name: ${{ inputs.artifact-name }}
          digest: ${{ inputs.artifact-digest }}

      # The build stage probed the zip for one handler, architecture, Python
      # and trigger. Deploying it as anything else would skip the guards
      # that matter, so a difference is refused rather than shipped.
      - name: Check the artifact was built for this function
        id: taken
        if: steps.source.outputs.from == 'artifact'
        env:
          DIR: ${{ steps.artifact.outputs.path }}
        run: |
          set -euo pipefail
          zip="${DIR}/lambda/worker.zip"
          target="${DIR}/lambda/target.json"
          if [ ! -f "${zip}" ] || [ ! -f "${target}" ]; then
            echo "::error::The artifact has no lambda/worker.zip and lambda/target.json: it is not a python-service build with a lambda-handler."
            exit 1
          fi
          built="$(jq -c '{handler, architecture, "python-version", trigger}' "${target}")"
          wanted="$(jq -cn --arg handler "${HANDLER}" --arg architecture "${ARCH}" --arg python "${PY}" --arg trigger "${TRIGGER}" \
            '{handler: $handler, architecture: $architecture, "python-version": $python, trigger: $trigger}')"
          if [ "${built}" != "${wanted}" ]; then
            echo "::error::The artifact was built for ${built}; this deploy is for ${wanted}."
            exit 1
          fi
          echo "zip=${zip}" >> "$GITHUB_OUTPUT"
          echo "code-sha256=$(openssl dgst -sha256 -binary "${zip}" | base64)" >> "$GITHUB_OUTPUT"

      - name: The zip to deploy
        env:
          BUILT_ZIP: ${{ steps.built.outputs.zip }}
          BUILT_SHA: ${{ steps.built.outputs.code-sha256 }}
          TAKEN_ZIP: ${{ steps.taken.outputs.zip }}
          TAKEN_SHA: ${{ steps.taken.outputs.code-sha256 }}
        run: |
          set -euo pipefail
          {
            echo "ZIP=${BUILT_ZIP:-${TAKEN_ZIP}}"
            echo "LOCAL_SHA=${BUILT_SHA:-${TAKEN_SHA}}"
          } >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-arn }}
          aws-region: ${{ inputs.region }}

      - name: Deploy
        env:
          FUNCTION: ${{ inputs.function-name }}
        run: |
          set -euo pipefail
          # The function's architecture is Terraform's, not this input's.
          # Refuse a mismatch rather than upload binaries it cannot load.
          deployed_arch=$(aws lambda get-function-configuration --function-name "$FUNCTION" \
            --query 'Architectures[0]' --output text)
          if [ "$deployed_arch" != "$ARCH" ]; then
            echo "::error::${FUNCTION} is ${deployed_arch}; this build is ${ARCH}"
            exit 1
          fi
          aws lambda update-function-code --function-name "$FUNCTION" \
            --zip-file "fileb://${ZIP}" --publish >/dev/null
          aws lambda wait function-updated --function-name "$FUNCTION"

      # The checksum AWS reports must be the zip this run built or took, so a green
      # run is evidence rather than an assumption.
      - name: Confirm what is deployed
        env:
          FUNCTION: ${{ inputs.function-name }}
        run: |
          set -euo pipefail
          REMOTE_SHA=$(aws lambda get-function --function-name "$FUNCTION" \
            --query 'Configuration.CodeSha256' --output text)
          echo "built:    $LOCAL_SHA"
          echo "deployed: $REMOTE_SHA"
          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "::error::the deployed checksum is not the zip this run built or took"
            exit 1
          fi
