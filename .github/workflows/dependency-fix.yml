# Clears the fleet's dependency-audit findings without anyone touching them.
#
# security.yml (SEC-003) fails a build when a resolved dependency has a
# published advisory. It finds; it never fixes. The fix is nearly always a
# re-lock of one transitive package, and it is needed in every repo on that
# package at once — on 2026-09-30 urllib3 and virtualenv were bumped by hand
# in api-kaianolevine-com, and every other uv repo carried the same two. A
# pnpm repo is the same job with a different lever: a raised range in
# package.json for a direct dependency, a `pnpm.overrides` entry for a
# transitive one, then a re-lock.
#
# Neither existing mechanism covers it. Dependabot security updates act on
# GitHub's advisory database, which lags the PyPA advisories pip-audit reads
# (and may never carry some), and they always open against the default
# branch, where automerge does not merge. Raising a floor in
# common-python-utils only reaches a repo after a release and a commons bump
# in each consumer, and is not needed: a library's lock never reaches its
# consumers, so each repo can re-lock the transitive package itself, within
# the ranges the library declares.
#
# So this runs from here, over the whole fleet, on a schedule, and for one
# repository when it is dispatched with `repository` set: api-kaianolevine-com
# does that within minutes of a build failing its dependency audit, so a new
# advisory does not wait for the next scheduled run. Either way:
#
#   1. discover — every repository the promote App is installed on, not
#      archived, with a uv.lock or a pnpm-lock.yaml on `dev` (uv.lock wins
#      if it has both). A new repo is covered the day the App is installed
#      on it; nothing is added to the repo itself.
#   2. fix, per repository — check out `dev`, run the same audit
#      security.yml runs, re-lock each flagged package at the smallest
#      version that clears it (scripts/fix-vulnerable-deps.py for uv,
#      scripts/fix-vulnerable-pnpm-deps.py for pnpm), re-audit, and open or
#      refresh one `fix(deps)` pull request into `dev` from the
#      `security-fix/deps` branch. automerge.yml merges it once CI is green;
#      it reaches `main` through the promotion pull request like anything
#      else.
#
# A job fails, and says why in its summary, only when an advisory is left
# that re-locking cannot clear: no fixed version is published yet, or a
# declared range keeps the lock below it (or, for pnpm, the dependency is
# declared in a form with no simple range to raise). That is the case that needs a
# person, and the red job is how it gets one.
#
# When `dev` is already clean the job opens nothing, and closes a leftover
# pull request from an earlier run. When the branch already holds the same
# fix on top of the current `dev`, it is left alone rather than re-pushed,
# so an unmerged fix does not restart CI every day.
#
# Each repository is audited with the first source its own build uses:
# pip-audit for uv, osv-scanner for pnpm. A finding only security.yml's
# GitHub advisory pass makes is fixed by hand.
#
# Runs as the promote App (the org secrets promote.yml and automerge.yml
# use), for two reasons: GITHUB_TOKEN cannot reach other repositories, and a
# push made with it starts no workflows, so the pull request would never get
# the CI run automerge waits for. The App needs Contents and Pull requests
# read and write on every fleet repository, and the two org secrets must be
# visible to this repository.

name: dependency-fix

on:
  schedule:
    # Once a day, 10:23 UTC (early morning in Chicago).
    - cron: "23 10 * * *"
  workflow_dispatch:
    inputs:
      repository:
        description: "Only this repository (name, without the org). Empty runs the whole fleet."
        type: string
        default: ""

permissions:
  contents: read

# One group per target: a fleet-wide advisory dispatches this once per
# affected repository within minutes, and GitHub keeps only the newest
# pending run in a group, so a single shared group would cancel all but two
# of them. Runs for different repositories touch different branches; a run
# for one repository still queues behind another for the same one.
concurrency:
  group: dependency-fix-${{ inputs.repository || 'fleet' }}
  cancel-in-progress: false

env:
  ORG: mini-app-polis
  BRANCH: security-fix/deps
  # The osv-scanner security.yml audits pnpm repositories with: keep the two
  # in step, so the fix and the gate read the same findings.
  OSV_SCANNER_VERSION: "2.5.1"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      - name: Require the promote App's credentials
        env:
          CLIENT_ID: ${{ secrets.PROMOTE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.PROMOTE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::PROMOTE_APP_CLIENT_ID and PROMOTE_APP_PRIVATE_KEY must be org secrets visible to this repository."
            exit 1
          fi

      # No `repositories` list: the token covers every repository the App
      # is installed on, which is exactly the set it could fix.
      - name: Mint an App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PROMOTE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROMOTE_APP_PRIVATE_KEY }}
          owner: ${{ env.ORG }}
          permission-contents: read

      # One matrix entry per repository: its name and which lock it has.
      - name: List repositories with a uv.lock or pnpm-lock.yaml on dev
        id: list
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ONLY: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          repos=()
          while read -r name; do
            [ -n "$ONLY" ] && [ "$name" != "$ONLY" ] && continue
            if gh api "repos/${ORG}/${name}/contents/uv.lock?ref=dev" --silent 2>/dev/null; then
              repos+=("${name} uv")
            elif gh api "repos/${ORG}/${name}/contents/pnpm-lock.yaml?ref=dev" --silent 2>/dev/null; then
              repos+=("${name} pnpm")
            fi
          done < <(gh api --paginate /installation/repositories \
                     --jq '.repositories[] | select(.archived | not) | .name')
          echo "Fleet: ${repos[*]:-none}"
          if [ -n "$ONLY" ] && [ "${#repos[@]}" -eq 0 ]; then
            echo "::error::${ORG}/${ONLY} has no uv.lock or pnpm-lock.yaml on dev, or the App is not installed on it."
            exit 1
          fi
          printf '%s\n' "${repos[@]}" \
            | jq -Rnc '[inputs | select(length > 0) | split(" ") | {repo: .[0], kind: .[1]}]' > repos.json
          echo "repos=$(cat repos.json)" >> "$GITHUB_OUTPUT"

  fix:
    needs: discover
    if: needs.discover.outputs.repos != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.repos) }}
    steps:
      # This repository, for the script.
      - uses: actions/checkout@v7
        with:
          path: fleet

      - name: Mint an App token for ${{ matrix.repo }}
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PROMOTE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROMOTE_APP_PRIVATE_KEY }}
          owner: ${{ env.ORG }}
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.ORG }}/${{ matrix.repo }}
          ref: dev
          token: ${{ steps.app-token.outputs.token }}
          path: target

      # The same Python and tooling as security.yml's dependency audit.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        if: matrix.kind == 'uv'
        uses: astral-sh/setup-uv@v7
        with:
          # The target's own `[tool.uv] required-version`, so the re-lock is
          # written by the uv its lock is pinned to. setup-uv looks in the
          # workspace root by default, and nothing is checked out there:
          # this repository is at fleet/ and the target at target/.
          version-file: target/pyproject.toml

      # The same Node and pnpm as the target's own CI: Node 22, and the pnpm
      # its package.json `packageManager` names. action-setup reads
      # package.json from the workspace root by default, and the target is
      # at target/.
      - name: Set up Node
        if: matrix.kind == 'pnpm'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up pnpm
        if: matrix.kind == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: target/package.json

      # As security.yml installs it: the asset URL from the release API,
      # cached per version so a run only downloads when the cache is cold.
      - name: Restore osv-scanner
        id: osv-cache
        if: matrix.kind == 'pnpm'
        uses: actions/cache@v6
        with:
          path: ~/.cache/fleet-tools/osv-scanner
          key: osv-scanner-${{ env.OSV_SCANNER_VERSION }}-linux-amd64

      - name: Install osv-scanner
        if: matrix.kind == 'pnpm' && steps.osv-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="${HOME}/.cache/fleet-tools/osv-scanner"
          mkdir -p "${dir}"
          api="https://api.github.com/repos/google/osv-scanner/releases/tags/v${OSV_SCANNER_VERSION}"
          url="$(curl -sSfL -H "Authorization: Bearer ${GH_TOKEN}" "${api}" \
                 | jq -r '.assets[].browser_download_url
                          | select(test("linux[_-]amd64([.]tar[.]gz)?$"))' \
                 | head -1)"
          if [ -z "${url}" ]; then
            echo "::error::No linux/amd64 asset found for osv-scanner v${OSV_SCANNER_VERSION}."
            exit 1
          fi
          case "${url}" in
            *.tar.gz) curl -sSfL "${url}" | tar -xz -C "${dir}" osv-scanner ;;
            *)        curl -sSfL "${url}" -o "${dir}/osv-scanner" ;;
          esac
          chmod +x "${dir}/osv-scanner"

      - name: Put osv-scanner on PATH
        if: matrix.kind == 'pnpm'
        run: |
          echo "${HOME}/.cache/fleet-tools/osv-scanner" >> "$GITHUB_PATH"
          "${HOME}/.cache/fleet-tools/osv-scanner/osv-scanner" --version

      - name: Re-lock vulnerable dependencies
        id: fix
        env:
          KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          if [ "$KIND" = pnpm ]; then
            python -m pip install --upgrade pip pyyaml
            python fleet/scripts/fix-vulnerable-pnpm-deps.py target
          else
            python -m pip install --upgrade pip pip-audit
            python fleet/scripts/fix-vulnerable-deps.py target
          fi
          cat fix-report.md >> "$GITHUB_STEP_SUMMARY"

      # The branch is always one commit on top of dev; if it already is that
      # commit, with these files, nothing is pushed. Shared with
      # commons-update.yml.
      - name: Open or refresh the pull request
        if: steps.fix.outputs.changed == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ env.ORG }}/${{ matrix.repo }}
          KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          files=(uv.lock)
          [ "$KIND" = pnpm ] && files=(package.json pnpm-lock.yaml)
          bash ../fleet/scripts/open-lock-pr.sh "$REPO" "$BRANCH" ../fix-subject.txt ../fix-body.md "${files[@]}"

      - name: Close a pull request dev no longer needs
        if: steps.fix.outputs.changed != 'true' && steps.fix.outputs.remaining == '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ env.ORG }}/${{ matrix.repo }}
        run: |
          set -euo pipefail
          pr=$(gh pr list -R "$REPO" --head "$BRANCH" --base dev --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr close "$pr" -R "$REPO" --delete-branch \
              --comment "dev's dependency audit is clean without this; closing."
          fi

      - name: Fail on advisories re-locking could not clear
        if: steps.fix.outputs.remaining != '0'
        env:
          REMAINING: ${{ steps.fix.outputs.remaining }}
        run: |
          echo "::error::${REMAINING} advisory(ies) in ${{ matrix.repo }} could not be cleared by re-locking; see the job summary."
          exit 1
