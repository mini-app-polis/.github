# The fleet's shared release job (ecosystem-standards CD-026, VER-006).
#
# Checks out the caller with its full history and runs the semantic-release
# action, which installs semantic-release and its plugins from the
# lockfile committed beside it. A repository whose release job is only
# that calls this workflow; one with steps of its own around the release
# (a build before it, a dispatch after it) calls the action as a step
# instead. Both install the same lockfile.
#
# Usage, in a consumer's .github/workflows/ci.yml:
#
#   jobs:
#     release:
#       needs: [test, security]
#       if: github.ref == 'refs/heads/main' && github.event_name == 'push'
#       permissions:
#         contents: write
#         issues: write
#         pull-requests: write
#       uses: mini-app-polis/.github/.github/workflows/release.yml@v3
#
# Run by hand from the Actions tab, it is a dry run of this repository's
# own next release, and nothing else: it changes nothing.
#
# It releases on main only, one run at a time per repository (the
# concurrency group below never cancels a release in progress). A commit
# that already has a release is not released again: the action finishes what
# that release is missing (its tag, its GitHub release, the major tag) and
# reports it, so re-running a release that failed partway completes it. The
# job's outputs say what happened:
#
#   published  "true" when the commit has a release after this run, cut now
#              or before; a caller's publish and notice jobs run on it
#   version    X.Y.Z
#   tag        vX.Y.Z (empty when nothing was released, as before)
#   sha        the commit the tag is on
#
# The release reconciler passes `ref`, a release tag on main, to finish that
# release in a new run; it is checked out and never cut again.
#
# In the same run as the build stage (stages-build.yml), a caller passes the
# build's `artifact-name` and `artifact-digest`. The release then downloads
# that artifact, refuses it unless the digest matches, and points
# PIPELINE_ARTIFACT_DIR at it for semantic-release, so a repository's
# publish step (an @semantic-release/exec publishCmd) ships the artifact that
# was built and tested rather than building again. Without them nothing
# changes: the release runs as it always has.
#
# The actions are named with `$/`, which resolves to this repository at
# the commit of this workflow that is running, so a caller pinned to a tag
# gets them, and the release tooling's lockfile, from that same tag.

name: release

on:
  workflow_call:
    inputs:
      dry-run:
        description: "Run semantic-release --dry-run: work out the next version and the notes, and change nothing."
        type: boolean
        default: false
      node-version:
        description: Node.js version to run semantic-release under.
        type: string
        default: "22"
      git-author-name:
        description: Author and committer name for the release commit. Empty keeps semantic-release-bot.
        type: string
        default: ""
      git-author-email:
        description: Author and committer email for the release commit. Used only with git-author-name.
        type: string
        default: ""
      artifact-name:
        description: "The build stage's artifact-name output. With artifact-digest, the release takes that artifact and sets PIPELINE_ARTIFACT_DIR to it for semantic-release's publish step."
        type: string
        default: ""
      artifact-digest:
        description: "The build stage's artifact-digest output (sha256:<hex>). The artifact is refused unless it matches."
        type: string
        default: ""
      ref:
        description: "A vX.Y.Z tag on main to finish rather than the run's commit: the release reconciler's `ref`. Empty: the run's commit."
        type: string
        default: ""
    secrets:
      app-client-id:
        description: "A GitHub App's client ID. With app-private-key, the release checks out and pushes as that App: for a repository whose main ruleset lets only the App past its pull-request rule."
        required: false
      app-private-key:
        description: The private key of the App named by app-client-id.
        required: false
    outputs:
      published:
        description: "\"true\" when the commit has a release after this run, cut by it or cut before and finished by it; \"false\" otherwise and on a dry run."
        value: ${{ jobs.release.outputs.published }}
      version:
        description: The release's version, X.Y.Z, or empty.
        value: ${{ jobs.release.outputs.version }}
      tag:
        description: The release's vX.Y.Z tag, or empty when the commit has none.
        value: ${{ jobs.release.outputs.tag }}
      sha:
        description: The commit the release tag is on, or empty.
        value: ${{ jobs.release.outputs.sha }}
  workflow_dispatch:

permissions:
  contents: read

env:
  # Package managers retry their own registry fetches with backoff; these
  # raise each one's attempt count so a registry blip is ridden out rather
  # than failing the stage.
  UV_HTTP_RETRIES: "5"
  PIP_RETRIES: "5"
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_mintimeout: "10000"
  npm_config_fetch_retry_maxtimeout: "60000"

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.release.outputs.published }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    env:
      # Read in a step's `if`, which cannot read secrets directly.
      APP_CLIENT_ID: ${{ secrets.app-client-id }}
    steps:
      # A caller that passes an App releases as that App: the push of the
      # version commit and the major tag goes past a main ruleset that
      # bypasses only the App. Without one, the run's own token, as before.
      - name: App token
        id: app
        if: env.APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          # What the promote App holds: Contents and Pull requests. Asking
          # for anything more fails the token.
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release reads the tag history to decide the next
          # version.
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
          # The reconciler's release tag, when it names one; otherwise the
          # run's commit.
          ref: ${{ inputs.ref }}

      # Both or neither: a name with no digest would take an artifact
      # nothing vouches for.
      - name: Check the build artifact inputs
        if: inputs.artifact-name != '' || inputs.artifact-digest != ''
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          ARTIFACT_DIGEST: ${{ inputs.artifact-digest }}
        run: |
          if [ -z "${ARTIFACT_NAME}" ] || [ -z "${ARTIFACT_DIGEST}" ]; then
            echo "::error::artifact-name and artifact-digest go together: pass both of the build stage's outputs, or neither."
            exit 1
          fi

      - name: Take the build stage's artifact
        id: artifact
        if: inputs.artifact-name != '' && inputs.artifact-digest != ''
        uses: $/.github/actions/fetch-artifact
        with:
          name: ${{ inputs.artifact-name }}
          digest: ${{ inputs.artifact-digest }}

      # Outside the checkout, so the release commit cannot pick it up.
      - name: Hand the artifact to semantic-release
        if: steps.artifact.outputs.path != ''
        env:
          ARTIFACT_DIR: ${{ steps.artifact.outputs.path }}
        run: echo "PIPELINE_ARTIFACT_DIR=${ARTIFACT_DIR}" >> "$GITHUB_ENV"

      - name: Release
        id: release
        uses: $/.github/actions/semantic-release
        with:
          github-token: ${{ steps.app.outputs.token || github.token }}
          # A run started by hand is always a dry run.
          dry-run: ${{ github.event_name == 'workflow_dispatch' || inputs.dry-run }}
          node-version: ${{ inputs.node-version || '22' }}
          git-author-name: ${{ inputs.git-author-name }}
          git-author-email: ${{ inputs.git-author-email }}
          ref: ${{ inputs.ref }}
