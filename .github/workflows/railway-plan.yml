# The fleet's shared Railway Infrastructure-as-Code plan, run on a pull
# request into main. It evaluates .railway/railway.ts against the live
# environment and writes the plan to the job summary; reading it is the
# review, and merging is the approval. It changes nothing.
#
# Modelled on mini-app-polis/infra's terraform.yml: plan on the pull
# request, plan again and apply on the push to main (railway-apply.yml).
#
# **A plan that destroys anything fails this check** unless the pull
# request is labelled allow-destroy — removing a service or a variable is
# the change that causes outages, so it takes a deliberate decision, made
# on the pull request where the plan is read. Labelled, the check passes and
# lists exactly what goes; merging applies it. Callers re-run the check on
# `labeled` / `unlabeled`, so adding the label is enough.
#
# **The token picks the environment.** A Railway project token is scoped to
# one environment; the caller passes the one for the environment this plan
# is for. `environment` only names the run. Never an account or workspace
# token.
#
# Plan output redacts variable values (Railway CLI default), so the summary
# carries names, never values.
#
# Usage, from a repository's .github/workflows/railway-plan.yml:
#
#   on:
#     pull_request:
#       branches: [main]
#       types: [opened, synchronize, reopened, labeled, unlabeled]
#       paths: [".railway/**", ".github/workflows/railway-plan.yml"]
#   permissions:
#     contents: read
#   jobs:
#     plan:
#       uses: mini-app-polis/.github/.github/workflows/railway-plan.yml@v3
#       secrets:
#         railway-token: ${{ secrets.RAILWAY_TOKEN }}

name: railway-plan

on:
  workflow_call:
    inputs:
      environment:
        description: "The Railway environment the token is scoped to. Names the run; it does not select the environment."
        type: string
        default: "production"
    secrets:
      railway-token:
        description: "A Railway project token scoped to the environment being planned. Never an account or workspace token."
        required: true
    outputs:
      changes:
        description: "'true' when the plan has changes to apply."
        value: ${{ jobs.plan.outputs.changes }}

permissions:
  contents: read

jobs:
  plan:
    # Fork pull requests get no secrets, and must not plan with ours.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: railway-plan-${{ inputs.environment }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      RAILWAY_TOKEN: ${{ secrets.railway-token }}
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The IaC SDK the CLI evaluates railway.ts with lives in .railway/
      # (its own package.json and lockfile), not at the root of a Python
      # repository.
      - name: Install the Railway CLI and IaC SDK
        run: |
          npm install --global --no-audit --no-fund @railway/cli@5.68.0
          npm ci --prefix .railway --no-audit --no-fund

      # --detailed-exit-code: 0 no changes, 2 changes, anything else an error.
      - name: plan
        id: plan
        run: |
          set +e
          railway config plan --verbose --detailed-exit-code > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          echo "changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # The CLI's plan reads like Terraform's: a `Plan: N to add, N to
      # change, N to destroy` line, and each destructive change on a line of
      # its own beginning `  - ` (`- Delete variable api.NAME`).
      - name: refuse unlabelled destroys
        if: steps.plan.outputs.changes == 'true'
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          grep -E '^  - ' plan.txt > destroys.txt || true
          [ -s destroys.txt ] || exit 0

          if [[ " $PR_LABELS " == *" allow-destroy "* ]]; then
            echo "::warning::This plan destroys Railway resources or variables; allowed by the allow-destroy label."
            heading="## ⚠️ Destroys — allowed by allow-destroy"
            code=0
          else
            echo "::error::This plan destroys Railway resources or variables. If that is intended, label the pull request allow-destroy."
            heading="## ⛔ Destroys — label the pull request allow-destroy to allow them"
            code=1
          fi
          cat destroys.txt
          { echo "$heading"; echo '```'; cat destroys.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: summary
        if: always()
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          # Nothing to summarise when the job failed before planning.
          [ -f plan.txt ] || exit 0
          {
            echo "## Railway plan — ${ENVIRONMENT}"
            echo
            grep -E '^(Plan:|✓ Your Railway configuration is already up to date|!)' plan.txt || true
            echo
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
