# The fleet's shared Railway Infrastructure-as-Code plan, run on a pull
# request into main. It evaluates .railway/railway.ts against the live
# environment and writes the plan to the job summary; reading it is the
# review, and merging is the approval. It changes nothing.
#
# Modelled on mini-app-polis/infra's terraform.yml: plan on the pull
# request, plan again and apply on the push to main (railway-apply.yml),
# and refuse destructive changes unless the pull request is labelled
# allow-destroy. Nothing is pinned between the two: the apply re-plans, as
# infra's does, so what lands is main as it is when it lands.
#
# **The token picks the environment.** A Railway project token is scoped to
# one environment; the caller passes the one for the environment this plan
# is for. `environment` only names the run. Never an account or workspace
# token.
#
# Plan output redacts variable values (Railway CLI default), so the summary
# carries names, never values.
#
# Usage, from a repository's .github/workflows/railway-plan.yml:
#
#   on:
#     pull_request:
#       branches: [main]
#       paths: [".railway/**"]
#   permissions:
#     contents: read
#   jobs:
#     plan:
#       uses: mini-app-polis/.github/.github/workflows/railway-plan.yml@v3
#       secrets:
#         railway-token: ${{ secrets.RAILWAY_TOKEN }}

name: railway-plan

on:
  workflow_call:
    inputs:
      environment:
        description: "The Railway environment the token is scoped to. Names the run; it does not select the environment."
        type: string
        default: "production"
    secrets:
      railway-token:
        description: "A Railway project token scoped to the environment being planned. Never an account or workspace token."
        required: true

jobs:
  plan:
    # Fork pull requests get no secrets, and must not plan with ours.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: railway-plan-${{ inputs.environment }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      RAILWAY_TOKEN: ${{ secrets.railway-token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The IaC SDK the CLI evaluates railway.ts with lives in .railway/
      # (its own package.json and lockfile), not at the root of a Python
      # repository.
      - name: Install the Railway CLI and IaC SDK
        run: |
          npm install --global --no-audit --no-fund @railway/cli@5.68.0
          npm ci --prefix .railway --no-audit --no-fund

      # --detailed-exit-code: 0 no changes, 2 changes, anything else an error.
      - name: plan
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set +e
          railway config plan --verbose --detailed-exit-code > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          {
            echo "## Railway plan — ${ENVIRONMENT}"
            echo
            case "$code" in
              0) echo "No changes." ;;
              2) echo "Changes pending. Destructive ones (removed services or variables) apply only if the pull request is labelled **allow-destroy**." ;;
              *) echo "**The plan failed.**" ;;
            esac
            echo
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
