# actionlint's configuration for this repository.
#
# Each ignore below is one known false positive, matched to one file and to
# the exact message, so a real finding of the same kind elsewhere still fails.
paths:
  .github/workflows/evaluate.yml:
    ignore:
      # github.job_workflow_sha is a real context property (the commit of the
      # reusable workflow a job is running), and evaluate.yml reads it on
      # purpose; actionlint's list of github context properties does not
      # have it yet.
      - 'property "job_workflow_sha" is not defined in object type'
  .github/workflows/release.yml:
    ignore:
      # `uses: $/...` resolves to this repository at the commit of the
      # workflow that is running, so a caller pinned to a tag gets the
      # action from that same tag. actionlint does not know the form and
      # reads it as an action reference with no ref.
      - 'specifying action "\$/\.github/actions/(semantic-release|fetch-artifact)" in invalid format because ref is missing'
  .github/workflows/stages-test.yml:
    ignore:
      # The same `$/` form as release.yml, for the stages' actions and for
      # the security workflow they call, so a caller pinned to a tag runs
      # every part of the stages from that tag. actionlint reads the action
      # form as a reference with no ref, and the workflow form as neither a
      # remote nor a local workflow.
      - 'specifying action "\$/\.github/actions/(python-checks|setup-uv)" in invalid format because ref is missing'
      - 'reusable workflow call "\$/\.github/workflows/security\.yml" at "uses" is not following the format'
  .github/workflows/stages-build.yml:
    ignore:
      # The same `$/` form as stages-test.yml, for the build stage's actions.
      - 'specifying action "\$/\.github/actions/(artifact-digest|lambda-zip|setup-uv)" in invalid format because ref is missing'
  .github/workflows/lambda-deploy.yml:
    ignore:
      # The same `$/` form, so a caller pinned to a tag builds or takes the
      # zip, and decides whether to deploy it, with the actions from that tag.
      - 'specifying action "\$/\.github/actions/(lambda-zip|fetch-artifact|deploy-decision)" in invalid format because ref is missing'
  .github/workflows/stages-deploy.yml:
    ignore:
      # The same `$/` form as stages-test.yml, for the deploy stage's actions
      # and for the Lambda deploy it delegates to.
      - 'specifying action "\$/\.github/actions/(deploy-decision|fetch-artifact|wrangler)" in invalid format because ref is missing'
      - 'reusable workflow call "\$/\.github/workflows/lambda-deploy\.yml" at "uses" is not following the format'
  .github/workflows/stages-verify.yml:
    ignore:
      # The same `$/` form as stages-test.yml, for the verify stage's
      # actions.
      - 'specifying action "\$/\.github/actions/(fetch-artifact|verify-decision)" in invalid format because ref is missing'
  .github/workflows/stages-evaluate.yml:
    ignore:
      # The same `$/` form as stages-test.yml, for the evaluation stages'
      # action.
      - 'specifying action "\$/\.github/actions/evaluate-decision" in invalid format because ref is missing'
  .github/workflows/required.yml:
    ignore:
      # The same `$/` form as stages-test.yml, so the organization ruleset's
      # copy at the current major's tag calls security.yml from that tag.
      - 'reusable workflow call "\$/\.github/workflows/security\.yml" at "uses" is not following the format'
