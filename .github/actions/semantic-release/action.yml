# The fleet's release step: semantic-release and its plugins, installed
# from the lockfile beside this file with `npm ci`, then run in the
# caller's checkout.
#
# Why a lockfile: the release jobs used to run
# `npm install --no-save semantic-release @semantic-release/...` with no
# versions, so every release installed whatever was newest on npm, with
# the job's write token in hand. A compromised plugin release would have
# run there. Installing from a committed lockfile fixes every package,
# transitive ones included, and Dependabot moves the lockfile forward in
# reviewed pull requests (ecosystem-standards VER-006).
#
# The install happens in this action's own directory, not the caller's,
# so a repository's own package.json and node_modules are never touched,
# and the plugins the caller's .releaserc lists are found here. A caller
# reaches this action at the ref it pinned for release.yml (or for this
# action), so the lockfile it runs is the one reviewed at that ref.
#
# Usage, as a step after a checkout with fetch-depth: 0:
#
#   - uses: mini-app-polis/.github/.github/actions/semantic-release@v3
#     with:
#       github-token: ${{ secrets.GITHUB_TOKEN }}
#
# A repository whose release job is only checkout and release can call
# .github/workflows/release.yml instead, which wraps this action.

name: semantic-release
description: Run semantic-release with the fleet's locked plugins, in the caller's checkout.

inputs:
  github-token:
    description: Token semantic-release pushes the release commit and tag with, and creates the GitHub release with.
    required: false
    default: ${{ github.token }}
  dry-run:
    description: "\"true\" runs semantic-release --dry-run: it works out the next version and the notes, and changes nothing."
    required: false
    default: "false"
  node-version:
    description: Node.js version to run semantic-release under.
    required: false
    default: "22"
  git-author-name:
    description: Author and committer name for the release commit. Empty keeps semantic-release's default (semantic-release-bot).
    required: false
    default: ""
  git-author-email:
    description: Author and committer email for the release commit. Used only with git-author-name.
    required: false
    default: ""

outputs:
  tag:
    description: The v* tag on the commit left at HEAD, or empty when the run released nothing.
    value: ${{ steps.released.outputs.tag }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    # --ignore-scripts: nothing in the release tooling needs an install
    # script, and none runs with the job's token in the environment.
    - name: Install the locked release tooling
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --ignore-scripts --no-audit --no-fund

    - name: Release
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DRY_RUN: ${{ inputs.dry-run }}
        AUTHOR_NAME: ${{ inputs.git-author-name }}
        AUTHOR_EMAIL: ${{ inputs.git-author-email }}
      run: |
        set -euo pipefail
        if [ -n "${AUTHOR_NAME}" ]; then
          export GIT_AUTHOR_NAME="${AUTHOR_NAME}" GIT_COMMITTER_NAME="${AUTHOR_NAME}"
          export GIT_AUTHOR_EMAIL="${AUTHOR_EMAIL}" GIT_COMMITTER_EMAIL="${AUTHOR_EMAIL}"
        fi
        args=()
        if [ "${DRY_RUN}" = "true" ]; then
          args+=(--dry-run)
        fi
        "${GITHUB_ACTION_PATH}/node_modules/.bin/semantic-release" "${args[@]}"

    # semantic-release tags the release commit it leaves at HEAD. No tag
    # there means the push carried nothing releasable.
    - name: Record the release tag
      id: released
      shell: bash
      run: echo "tag=$(git tag --points-at HEAD --list 'v*' | head -n1)" >> "${GITHUB_OUTPUT}"
