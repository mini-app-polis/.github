# The fleet's release step: semantic-release and its plugins, installed
# from the lockfile beside this file with `npm ci`, then run in the
# caller's checkout.
#
# Why a lockfile: the release jobs used to run
# `npm install --no-save semantic-release @semantic-release/...` with no
# versions, so every release installed whatever was newest on npm, with
# the job's write token in hand. A compromised plugin release would have
# run there. Installing from a committed lockfile fixes every package,
# transitive ones included, and Dependabot moves the lockfile forward in
# reviewed pull requests (ecosystem-standards VER-006).
#
# The install happens in this action's own directory, not the caller's,
# so a repository's own package.json and node_modules are never touched,
# and the plugins the caller's .releaserc lists are found here. A caller
# reaches this action at the ref it pinned for release.yml (or for this
# action), so the lockfile it runs is the one reviewed at that ref.
#
# Usage, as a step after a checkout with fetch-depth: 0:
#
#   - uses: mini-app-polis/.github/.github/actions/semantic-release@v3
#     with:
#       github-token: ${{ secrets.GITHUB_TOKEN }}
#
# A repository whose release job is only checkout and release can call
# .github/workflows/release.yml instead, which wraps this action.
#
# Running it again on a released commit cuts nothing. release-state.sh
# first looks for this commit's release: a vX.Y.Z tag on it, or the release
# commit pushed on top of it. When there is one, semantic-release does not
# run; the action finishes what that release is missing (its tag, its
# GitHub release, the major tag) and reports it as published. So a re-run of
# a release that failed partway finishes it, with no second tag and no
# second release commit. A step of the caller's own after this one (a
# package upload, a fleet notice) runs on `published` and makes itself safe
# to repeat; the repository README, "Shared release", says how.
#
# It cuts a release on main only: on any other ref it refuses, unless it is
# a dry run or `ref` names a release tag on main to finish.

name: semantic-release
description: Run semantic-release with the fleet's locked plugins, in the caller's checkout.

inputs:
  github-token:
    description: Token semantic-release pushes the release commit and tag with, and creates the GitHub release with.
    required: false
    default: ${{ github.token }}
  dry-run:
    description: "\"true\" runs semantic-release --dry-run: it works out the next version and the notes, and changes nothing."
    required: false
    default: "false"
  node-version:
    description: Node.js version to run semantic-release under.
    required: false
    default: "22"
  git-author-name:
    description: Author and committer name for the release commit. Empty keeps semantic-release's default (semantic-release-bot).
    required: false
    default: ""
  git-author-email:
    description: Author and committer email for the release commit. Used only with git-author-name.
    required: false
    default: ""
  ref:
    description: "A vX.Y.Z tag on main to finish rather than this checkout's HEAD: the release reconciler's `ref`. It is never cut again; what it is missing is finished. Empty: HEAD."
    required: false
    default: ""

outputs:
  published:
    description: "\"true\" when this commit has a release on the remote after this run: cut by it, or cut before and finished by it. \"false\" otherwise, and always on a dry run. A caller's publish and notice steps run on it."
    value: ${{ steps.released.outputs.published }}
  version:
    description: The release's version, X.Y.Z, or empty when the commit has none.
    value: ${{ steps.released.outputs.version }}
  tag:
    description: The release's vX.Y.Z tag, or empty when the commit has none. Set on a run that finished an earlier release too.
    value: ${{ steps.released.outputs.tag }}
  sha:
    description: The commit the release tag is on (the release commit, where the repository makes one), or empty.
    value: ${{ steps.released.outputs.sha }}
  resumed:
    description: "\"true\" when the release was cut by an earlier run and this one only finished it."
    value: ${{ steps.released.outputs.resumed }}

runs:
  using: composite
  steps:
    # What a run on this commit has to do: release, or finish a release
    # already cut. The fetch brings main and the tags up to date with the
    # remote (a re-run's checkout may be older than either); --force because
    # a major tag moves, and a fetch without it refuses to update a tag it
    # already has. A checkout that cannot fetch (no persisted credentials)
    # goes on with what it checked out, which is how it ran before.
    - name: Find this commit's release
      id: state
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        DRY_RUN: ${{ inputs.dry-run }}
        TARGET_REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        if ! git fetch --quiet --force --tags origin "+refs/heads/main:refs/remotes/origin/main"; then
          echo "::warning::Could not fetch main and the tags from origin; working from the checkout's."
        fi
        state="$(bash "${GITHUB_ACTION_PATH}/release-state.sh")"
        if grep -qx 'state=finish' <<< "${state}"; then
          tag="$(sed -n 's/^tag=//p' <<< "${state}")"
          # A 404 is the one answer that means no release; anything else
          # fails the step rather than making a second one.
          if err="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --silent 2>&1)"; then
            exists=true
          elif grep -q 'HTTP 404' <<< "${err}"; then
            exists=false
          else
            echo "::error::Could not ask GitHub for the release of ${tag}: ${err}"
            exit 1
          fi
          state="$(GITHUB_RELEASE_EXISTS="${exists}" bash "${GITHUB_ACTION_PATH}/release-state.sh")"
        fi
        echo "${state}"
        echo "${state}" >> "${GITHUB_OUTPUT}"

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: steps.state.outputs.state == 'release'
      with:
        node-version: ${{ inputs.node-version }}

    # --ignore-scripts: nothing in the release tooling needs an install
    # script, and none runs with the job's token in the environment.
    - name: Install the locked release tooling
      if: steps.state.outputs.state == 'release'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --ignore-scripts --no-audit --no-fund

    - name: Release
      if: steps.state.outputs.state == 'release'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DRY_RUN: ${{ inputs.dry-run }}
        AUTHOR_NAME: ${{ inputs.git-author-name }}
        AUTHOR_EMAIL: ${{ inputs.git-author-email }}
      run: |
        set -euo pipefail
        if [ -n "${AUTHOR_NAME}" ]; then
          export GIT_AUTHOR_NAME="${AUTHOR_NAME}" GIT_COMMITTER_NAME="${AUTHOR_NAME}"
          export GIT_AUTHOR_EMAIL="${AUTHOR_EMAIL}" GIT_COMMITTER_EMAIL="${AUTHOR_EMAIL}"
        fi
        # bin/git retries a push GitHub fails transiently; see its header.
        SEMANTIC_RELEASE_REAL_GIT="$(command -v git)"
        export SEMANTIC_RELEASE_REAL_GIT
        export PATH="${GITHUB_ACTION_PATH}/bin:${PATH}"
        args=()
        if [ "${DRY_RUN}" = "true" ]; then
          args+=(--dry-run)
        fi
        "${GITHUB_ACTION_PATH}/node_modules/.bin/semantic-release" "${args[@]}"

    # A release cut before this run: push its missing tag and move its major
    # tag (finish-release.sh), then make its missing GitHub release. A dry
    # run says what it would do and does nothing.
    - name: Finish the release
      if: steps.state.outputs.state == 'finish'
      shell: bash
      env:
        DRY_RUN: ${{ inputs.dry-run }}
        TAG: ${{ steps.state.outputs.tag }}
        VERSION: ${{ steps.state.outputs.version }}
        SHA: ${{ steps.state.outputs.sha }}
        CREATE_TAG: ${{ steps.state.outputs.create-tag }}
        MOVE_MAJOR_TAG: ${{ steps.state.outputs.move-major-tag }}
        CREATE_GITHUB_RELEASE: ${{ steps.state.outputs.create-github-release }}
      run: |
        set -euo pipefail
        echo "${TAG} is this commit's release, on ${SHA}. Missing: tag ${CREATE_TAG}, GitHub release ${CREATE_GITHUB_RELEASE}, major tag ${MOVE_MAJOR_TAG}."
        if [ "${DRY_RUN}" = "true" ]; then
          echo "Dry run: nothing finished."
          exit 0
        fi
        SEMANTIC_RELEASE_REAL_GIT="$(command -v git)"
        export SEMANTIC_RELEASE_REAL_GIT
        PATH="${GITHUB_ACTION_PATH}/bin:${PATH}" bash "${GITHUB_ACTION_PATH}/finish-release.sh"

    # The release notes are the release commit's message body, which is
    # where the fleet's @semantic-release/git message puts them. A tag on a
    # commit that is not a release commit gets GitHub's generated notes.
    - name: Make the missing GitHub release
      if: steps.state.outputs.state == 'finish' && steps.state.outputs.create-github-release == 'true' && inputs.dry-run != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ steps.state.outputs.tag }}
        SHA: ${{ steps.state.outputs.sha }}
        LATEST: ${{ steps.state.outputs.latest }}
        RELEASE_COMMIT: ${{ steps.state.outputs.release-commit }}
      run: |
        set -euo pipefail
        notes=()
        if [ "${RELEASE_COMMIT}" = "true" ]; then
          git log -1 --format=%b "${SHA}" > "${RUNNER_TEMP}/release-notes.md"
          notes=(--notes-file "${RUNNER_TEMP}/release-notes.md")
        else
          notes=(--generate-notes)
        fi
        gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
          --title "${TAG}" --latest="${LATEST}" "${notes[@]}"
        echo "made the GitHub release ${TAG}"

    # semantic-release tags the release commit it leaves at HEAD; no release
    # tag there means the push carried nothing releasable. A finished
    # release is the one release-state.sh found. Only vX.Y.Z tags count: a
    # major tag on the same commit is not the release.
    - name: Record the release
      id: released
      shell: bash
      env:
        DRY_RUN: ${{ inputs.dry-run }}
        STATE: ${{ steps.state.outputs.state }}
        FOUND_TAG: ${{ steps.state.outputs.tag }}
        FOUND_SHA: ${{ steps.state.outputs.sha }}
      run: |
        set -euo pipefail
        resumed=false
        if [ "${STATE}" = "finish" ]; then
          tag="${FOUND_TAG}" sha="${FOUND_SHA}" resumed=true
        else
          tag="$(git tag --points-at HEAD --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          sha=""
          if [ -n "${tag}" ]; then
            sha="$(git rev-parse HEAD)"
          fi
        fi
        published=false
        if [ -n "${tag}" ] && [ "${DRY_RUN}" != "true" ]; then
          published=true
        fi
        {
          echo "published=${published}"
          echo "tag=${tag}"
          echo "version=${tag#v}"
          echo "sha=${sha}"
          echo "resumed=${resumed}"
        } >> "${GITHUB_OUTPUT}"
        echo "published=${published} tag=${tag} sha=${sha} resumed=${resumed}"
