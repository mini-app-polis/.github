# Automated dependency updates.
#
# The fleet audits dependencies on every build (ecosystem-standards
# SEC-003), which finds what has gone vulnerable but never fixes it.
# Clearing those by hand does not scale — one repo needed 45 advisories
# closed in a single sitting. This is the other half: keep dependencies
# current so the audit has less to find.
#
# `commit-message.prefix` is load-bearing, not cosmetic. Dependabot's
# default subject is "Bump x from y to z", which is not a Conventional
# Commit. Every repo here releases through semantic-release, so an
# unprefixed subject both trips VER-001 and cuts no release — the fix
# would land on main and never reach the registry.
#
# Minor and patch updates are grouped into one pull request per
# ecosystem per week. Majors arrive on their own, because a major is a
# decision rather than a bump.
version: 2
updates:
  # Every third-party action here is pinned by commit SHA with its version
  # in a trailing comment. Dependabot moves the SHA and the comment
  # together. Sunday, so the week's pin bumps are waiting before Monday's
  # npm run rather than landing alongside it.
  #
  # `/` alone covers .github/workflows and nothing else, so the composite
  # actions' directories are listed too, or their pins would never move.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci(deps)"

  # The release tooling every repo's release installs: semantic-release and
  # its plugins, locked in .github/actions/semantic-release (VER-006).
  # Moving this lockfile forward is the only way those versions change.
  - package-ecosystem: "npm"
    directory: "/.github/actions/semantic-release"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      release-tooling:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # npm is replaced by npm-stub through `overrides` (see the README beside
    # the lockfile), so the lockfile holds a link with no version. Dependabot
    # cannot update a link, and an advisory against npm fails the whole run.
    ignore:
      - dependency-name: "npm"
    commit-message:
      prefix: "ci(deps)"

  # The wrangler the deploy stage uploads Pages sites with, locked in
  # .github/actions/wrangler.
  - package-ecosystem: "npm"
    directory: "/.github/actions/wrangler"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      deploy-tooling:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # A week before a new release is offered: what a deploy installs should
    # have been out long enough for a bad release to be pulled.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
