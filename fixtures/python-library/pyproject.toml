# A fixture for the python-library profile: the smallest repository the
# profile's stages run green against. It is never packaged, published or
# deployed; the classifier below makes PyPI refuse an upload outright.
[project]
name = "fixture-python-library"
version = "0.0.0"
description = "Pipeline fixture for the python-library profile."
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
