# A fixture for the shared-workflows profile: the smallest reusable workflow
# that passes the profile's static analysis. GitHub runs workflows only from
# the repository root's .github/workflows, so this one never runs here.
name: hello

on:
  workflow_call:

permissions:
  contents: read

jobs:
  hello:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Say hello
        run: echo "hello from the shared-workflows fixture"
